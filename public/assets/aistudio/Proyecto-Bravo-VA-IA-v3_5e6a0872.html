<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BravoVa + Brav IA — Los expertos en vender barato</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --spring-bouncy: cubic-bezier(0.34, 1.56, 0.64, 1);
      --spring-snappy: cubic-bezier(0.22, 1.35, 0.36, 1);
      --ease-fluid: cubic-bezier(0.16, 1, 0.3, 1);
      --bravo-aura-grad: linear-gradient(90deg, #D9232A, #F59E0B, #10B981, #06B6D4, #3B82F6, #D9232A);
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top left, #1e293b 0%, #0f172a 60%, #090d16 100%);
      margin: 0;
      padding: 0;
      color: #0f172a;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .thin-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.45); border-radius: 99px; }

    .bravo-underline {
      width: 46px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #F59E0B 0%, #D9232A 100%);
      margin: 4px auto 0 auto;
    }

    .phone-chassis {
      width: 100%;
      max-width: 400px;
      height: 820px;
      border-radius: 55px;
      border: 6px solid #18181b;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.75), 0 0 0 1.5px rgba(255,255,255,0.10);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #F8FAFC;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      mask-image: radial-gradient(white, black);
      outline: 0.5px solid rgba(255,255,255,0.06);
      outline-offset: -0.5px;
    }

    /* Superficies translúcidas multicapa y modo oscuro OLED */


    .phone-chassis.phone-dark {
      background: #090D16 !important;
      color: #F8FAFC !important;
      border-color: #27272a !important;
    }
    #appViewport,
    .phone-chassis.phone-dark #appViewport {
      background: transparent !important;
      position: relative;
      z-index: 10;
    }

    /* Fondo ambiental vivo y dinámico según tienda */
    #bravoAmbientBackdrop {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .ambient-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(55px);
      will-change: transform;
      transition: background 0.8s ease;
    }
    .ambient-orb-1 {
      top: -45px;
      left: -55px;
      width: 260px;
      height: 260px;
      background: rgba(217, 35, 42, 0.14);
      animation: ambientOrbFloat 12s ease-in-out infinite;
    }
    .ambient-orb-2 {
      bottom: 85px;
      right: -50px;
      width: 250px;
      height: 250px;
      background: rgba(245, 158, 11, 0.12);
      animation: ambientOrbFloatAlt 12s ease-in-out infinite;
    }
    .phone-chassis.store-arca .ambient-orb-1 {
      background: rgba(13, 148, 136, 0.16);
    }
    .phone-chassis.store-arca .ambient-orb-2 {
      background: rgba(52, 211, 153, 0.12);
    }
    .phone-chassis.phone-dark .ambient-orb-1 {
      background: rgba(217, 35, 42, 0.19);
    }
    .phone-chassis.phone-dark .ambient-orb-2 {
      background: rgba(245, 158, 11, 0.15);
    }
    .phone-chassis.phone-dark.store-arca .ambient-orb-1 {
      background: rgba(13, 148, 136, 0.22);
    }
    .phone-chassis.phone-dark.store-arca .ambient-orb-2 {
      background: rgba(52, 211, 153, 0.16);
    }
    @keyframes ambientOrbFloat {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      33% { transform: translate3d(28px, 34px, 0) scale(1.09); }
      66% { transform: translate3d(-18px, 52px, 0) scale(0.95); }
    }
    @keyframes ambientOrbFloatAlt {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      33% { transform: translate3d(-32px, -28px, 0) scale(1.08); }
      66% { transform: translate3d(20px, -48px, 0) scale(0.94); }
    }
    
    /* Superficies, cabeceras y barras fijas */
    .phone-chassis.phone-dark .dm-surface:not(.bravo-glass-header):not(.bravo-glass-dock):not(.bravo-glass-statusbar):not(.bravo-glass-card):not(.bravo-glass-pill):not(.bravo-glass-fab):not(.glass-header):not(.glass-nav-dock):not(.bravo-ai-aura):not(.bravo-ai-aura-focus) {
      background-color: #0F172A !important;
      border-color: #1E293B !important;
      font-variant-numeric: tabular-nums;
    }
    .tabular-nums, #livePhoneClock, #floatingCartCountBadge, #batteryPercent, #liveDeliverySpeedBadge, #liveDeliveryEtaText, #liveDeliveryDistText, #chatBudgetLabel {
      font-variant-numeric: tabular-nums;
    }
    .phone-chassis.phone-dark .dm-surface-ext {
      color: #F8FAFC !important;
    }

    /* Tarjetas y contenedores de productos */
    .phone-chassis.phone-dark .dm-card,
    .phone-chassis.phone-dark .bg-white {
      background-color: #162032 !important;
      border-color: #24344D !important;
      color: #F8FAFC !important;
    }
    .phone-chassis.phone-dark .bg-slate-50,
    .phone-chassis.phone-dark .bg-slate-100 {
      background-color: #1E293B !important;
      border-color: #334155 !important;
      color: #F8FAFC !important;
    }
    .phone-chassis.phone-dark .bg-slate-200 {
      background-color: #2D3D54 !important;
    }

    /* Tipografía en modo oscuro */
    .phone-chassis.phone-dark .dm-text,
    .phone-chassis.phone-dark .text-slate-900,
    .phone-chassis.phone-dark .text-slate-800,
    .phone-chassis.phone-dark .text-slate-700 {
      color: #F8FAFC !important;
    }
    .phone-chassis.phone-dark .dm-muted,
    .phone-chassis.phone-dark .text-slate-600,
    .phone-chassis.phone-dark .text-slate-500,
    .phone-chassis.phone-dark .text-slate-400 {
      color: #94A3B8 !important;
    }

    /* Bordes sutiles con contraste */
    .phone-chassis.phone-dark .border-slate-100,
    .phone-chassis.phone-dark .border-slate-200,
    .phone-chassis.phone-dark .border-slate-300 {
      border-color: #24344D !important;
    }

    /* Inputs, buscador y controles */
    .phone-chassis.phone-dark input:not(.ai-aura-inner-input),
    .phone-chassis.phone-dark textarea,
    .phone-chassis.phone-dark select,
    .phone-chassis.phone-dark .dm-input:not(.ai-aura-inner-input) {
      background-color: #1E293B !important;
      border-color: #334155 !important;
      color: #F8FAFC !important;
    }
    .phone-chassis.phone-dark .ai-aura-inner-input {
      background-color: transparent !important;
      border-color: transparent !important;
      color: #F8FAFC !important;
    }
    .phone-chassis.phone-dark input::placeholder,
    .phone-chassis.phone-dark textarea::placeholder {
      color: #64748B !important;
    }

    /* Píldoras y etiquetas con brillo suave */
    .phone-chassis.phone-dark .bg-red-50,
    .phone-chassis.phone-dark .bg-rose-50 {
      background-color: rgba(217, 35, 42, 0.20) !important;
      color: #FCA5A5 !important;
      border-color: rgba(217, 35, 42, 0.40) !important;
    }
    .phone-chassis.phone-dark .bg-teal-50 {
      background-color: rgba(13, 148, 136, 0.22) !important;
      color: #5EEAD4 !important;
      border-color: rgba(13, 148, 136, 0.40) !important;
    }
    .phone-chassis.phone-dark .bg-\[\#F3EAD8\] {
      background-color: rgba(245, 158, 11, 0.20) !important;
      color: #FCD34D !important;
    }
    .phone-chassis.phone-dark .bg-\[\#E0F2FE\] {
      background-color: rgba(2, 132, 199, 0.22) !important;
      color: #7DD3FC !important;
    }
    .phone-chassis.phone-dark .bg-\[\#FCE7F3\] {
      background-color: rgba(217, 35, 42, 0.25) !important;
      color: #FCA5A5 !important;
    }

    /* Barra de estado: hora, señal e isla dinámica */
    .phone-chassis.phone-dark #livePhoneClock,
    .phone-chassis.phone-dark .status-bar-icon {
      color: #F8FAFC !important;
    }
    .phone-chassis.phone-dark #batteryBorder {
      border-color: rgba(255, 255, 255, 0.8) !important;
    }
    .phone-chassis.phone-dark #batteryNub {
      background-color: rgba(255, 255, 255, 0.8) !important;
    }
    .phone-chassis.phone-dark #batteryPercent {
      color: #F8FAFC !important;
    }
    .phone-chassis.phone-dark #dynamicIsland {
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12) !important;
    }

    /* Indicador inferior de navegación */
    .phone-chassis.phone-dark #homeIndicatorBar {
      background-color: rgba(255, 255, 255, 0.65) !important;
    }

    /* Barra de navegación inferior */
    .phone-chassis.phone-dark nav svg {
      color: #94A3B8;
    }
    .phone-chassis.phone-dark nav svg.text-\[\#D9232A\] {
      color: #D9232A !important;
    }

    /* Botones de acción flotantes (FAB: IA y Carrito) con Sistema Translúcido Multicapa BravoVa */
    .bravo-glass-fab {
      backdrop-filter: blur(36px) saturate(210%);
      -webkit-backdrop-filter: blur(36px) saturate(210%);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.90) 0%, rgba(255, 255, 255, 0.72) 100%);
      border: 1px solid rgba(255, 255, 255, 0.94);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9), inset 0 -1px 1px rgba(255, 255, 255, 0.22), 0 12px 28px -6px rgba(217, 35, 42, 0.12);
      transition: transform 0.35s var(--spring-bouncy), box-shadow 0.25s ease, opacity 0.2s ease !important;
    }
    .phone-chassis.store-arca .bravo-glass-fab {
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9), inset 0 -1px 1px rgba(255, 255, 255, 0.22), 0 12px 28px -6px rgba(13, 148, 136, 0.14);
    }
    .phone-chassis.phone-dark .bravo-glass-fab {
      background: linear-gradient(145deg, rgba(24, 34, 52, 0.90) 0%, rgba(15, 23, 42, 0.80) 100%) !important;
      border-color: rgba(255, 255, 255, 0.16) !important;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.18), 0 14px 32px -4px rgba(0, 0, 0, 0.65) !important;
    }
    .bravo-glass-fab:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.95), 0 18px 34px -6px rgba(217, 35, 42, 0.22);
    }
    .phone-chassis.store-arca .bravo-glass-fab:hover {
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.95), 0 18px 34px -6px rgba(13, 148, 136, 0.24);
    }
    .bravo-glass-fab:active {
      transform: scale(0.88);
    }

    /* Borde luminoso iridiscente con halo ambiental difuminado (.bravo-ai-aura) */
    @keyframes aiSpectrumFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .bravo-ai-aura {
      position: relative;
      isolation: isolate;
      border-radius: 9999px;
      background: #FFFFFF;
      border-color: transparent !important;
    }
    .bravo-ai-aura--card {
      border-radius: 24px;
    }
    .bravo-ai-aura--input {
      border-radius: 20px;
    }
    .phone-chassis.phone-dark .bravo-ai-aura {
      background: #131A29 !important;
    }
    .bravo-ai-aura::before {
      content: "";
      position: absolute;
      inset: -1.5px;
      border-radius: inherit;
      padding: 1.5px;
      background: var(--bravo-aura-grad);
      background-size: 300% 300%;
      animation: aiSpectrumFlow 5s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 2;
    }
    .bravo-ai-aura::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: inherit;
      background: var(--bravo-aura-grad);
      background-size: 300% 300%;
      animation: aiSpectrumFlow 5s linear infinite;
      filter: blur(10px);
      opacity: 0.42;
      z-index: -1;
      pointer-events: none;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }
    .bravo-ai-aura:hover::after,
    .bravo-ai-aura:focus-within::after {
      opacity: 0.78;
      filter: blur(13px);
    }
    .bravo-ai-aura--subtle::after {
      opacity: 0.28;
      filter: blur(9px);
    }
    .bravo-ai-aura--subtle:hover::after,
    .bravo-ai-aura--subtle:focus-within::after {
      opacity: 0.62;
      filter: blur(12px);
    }
    /* Variante condicional en barra de chat (activa en foco o escritura) */
    .bravo-ai-aura-focus {
      position: relative;
      isolation: isolate;
      border-radius: 20px;
      background: #FFFFFF;
      border: 1px solid rgba(203, 213, 225, 0.85);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .phone-chassis.phone-dark .bravo-ai-aura-focus {
      background: #131A29 !important;
      border-color: #334155;
    }
    .bravo-ai-aura-focus::before {
      content: "";
      position: absolute;
      inset: -1.5px;
      border-radius: inherit;
      padding: 1.5px;
      background: var(--bravo-aura-grad);
      background-size: 300% 300%;
      animation: aiSpectrumFlow 5s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.28s ease;
      z-index: 2;
    }
    .bravo-ai-aura-focus::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: inherit;
      background: var(--bravo-aura-grad);
      background-size: 300% 300%;
      animation: aiSpectrumFlow 5s linear infinite;
      filter: blur(10px);
      opacity: 0;
      z-index: -1;
      pointer-events: none;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }
    .bravo-ai-aura-focus:focus-within,
    .bravo-ai-aura-focus.is-typing {
      border-color: transparent !important;
    }
    .bravo-ai-aura-focus:focus-within::before,
    .bravo-ai-aura-focus.is-typing::before {
      opacity: 1;
    }
    .bravo-ai-aura-focus:focus-within::after,
    .bravo-ai-aura-focus.is-typing::after {
      opacity: 0.68;
      filter: blur(12px);
    }
    .bravo-ai-aura-focus:focus-within:hover::after {
      opacity: 0.82;
      filter: blur(14px);
    }
    .bravo-ai-aura.is-listening::after {
      opacity: 0.92;
      filter: blur(14px);
    }
    .bravo-ai-aura-focus.is-listening {
      border-color: transparent !important;
    }
    .bravo-ai-aura-focus.is-listening::before {
      opacity: 1;
    }
    .bravo-ai-aura-focus.is-listening::after {
      opacity: 0.85;
      filter: blur(14px);
    }
    .voice-listening-ring {
      color: #D9232A !important;
    }

    /* Ecualizador acústico en vivo de 4 barras para dictado por voz */
    .voice-eq-bars {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 14px;
      width: 16px;
    }
    .voice-eq-bars span {
      display: block;
      width: 2.5px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #D9232A 0%, #F59E0B 100%);
      transform-origin: center;
      will-change: transform;
      animation: voiceWaveBar 0.62s ease-in-out infinite;
    }
    .phone-chassis.store-arca .voice-eq-bars span {
      background: linear-gradient(180deg, #0D9488 0%, #10B981 100%);
    }
    .voice-eq-bars span:nth-child(2) { animation-delay: 0.14s; }
    .voice-eq-bars span:nth-child(3) { animation-delay: 0.28s; }
    .voice-eq-bars span:nth-child(4) { animation-delay: 0.09s; }
    @keyframes voiceWaveBar {
      0%, 100% { transform: scaleY(0.28); }
      50% { transform: scaleY(1); }
    }

    /* Orbe de plasma vivo de 3 capas para Brav IA */
    .bravo-ai-orb {
      position: relative;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      overflow: hidden;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.24), rgba(15, 23, 42, 0.12));
      box-shadow: 0 6px 16px -3px rgba(217, 35, 42, 0.36);
    }
    .phone-chassis.store-arca .bravo-ai-orb {
      box-shadow: 0 6px 16px -3px rgba(13, 148, 136, 0.36);
    }
    .bravo-ai-orb-ring {
      position: absolute;
      inset: -25%;
      border-radius: 9999px;
      background: conic-gradient(from 0deg, #D9232A, #F59E0B, #10B981, #06B6D4, #3B82F6, #D9232A);
      will-change: transform;
      animation: orbSpin 6s linear infinite;
      opacity: 0.92;
    }
    .phone-chassis.store-arca .bravo-ai-orb-ring {
      background: conic-gradient(from 0deg, #0D9488, #34D399, #06B6D4, #3B82F6, #F59E0B, #0D9488);
    }
    .bravo-ai-orb-core {
      position: absolute;
      inset: 3px;
      border-radius: 9999px;
      background: radial-gradient(circle at 32% 30%, #F59E0B 0%, #D9232A 58%, #7F1D1D 100%);
      will-change: transform, opacity;
      animation: plasmaBreathe 2.8s ease-in-out infinite;
    }
    .phone-chassis.store-arca .bravo-ai-orb-core {
      background: radial-gradient(circle at 32% 30%, #34D399 0%, #0D9488 58%, #115E59 100%);
    }
    .bravo-ai-orb--fast .bravo-ai-orb-ring {
      animation-duration: 2.2s;
    }
    .bravo-ai-orb--fast .bravo-ai-orb-core {
      animation-duration: 1.25s;
    }
    .bravo-ai-orb-spark {
      position: relative;
      z-index: 2;
      width: 52%;
      height: 52%;
      color: #FFFFFF;
      filter: drop-shadow(0 1px 4px rgba(255, 255, 255, 0.65));
      will-change: transform;
      animation: plasmaBreathe 2.8s ease-in-out infinite reverse;
    }
    @keyframes orbSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes plasmaBreathe {
      0%, 100% { transform: scale(0.92); opacity: 0.88; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    /* Tarjeta Bravísima holográfica 3D y barra de progreso luminosa */
    .bravisima-holo-card {
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.5s var(--spring-bouncy), box-shadow 0.3s ease;
    }
    .bravisima-holo-glare {
      position: absolute;
      inset: -35%;
      border-radius: 9999px;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0.12) 34%, rgba(255, 255, 255, 0) 68%);
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: overlay;
      will-change: transform, opacity;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 5;
    }
    .bravisima-glint-sweep {
      position: absolute;
      top: -20%;
      bottom: -20%;
      left: 0;
      width: 42%;
      background: linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.28) 50%, rgba(255,255,255,0) 100%);
      pointer-events: none;
      will-change: transform, opacity;
      animation: cardGlintSweep 4.5s ease-in-out infinite;
      z-index: 4;
    }
    @keyframes cardGlintSweep {
      0% { transform: translate3d(-160%, 0, 0) skewX(-24deg); opacity: 0; }
      8% { opacity: 0.85; }
      28% { transform: translate3d(320%, 0, 0) skewX(-24deg); opacity: 0; }
      100% { transform: translate3d(320%, 0, 0) skewX(-24deg); opacity: 0; }
    }
    .bravisima-progress-tip {
      position: absolute;
      top: 50%;
      width: 11px;
      height: 11px;
      margin-top: -5.5px;
      margin-left: -5.5px;
      border-radius: 9999px;
      background: #FEF3C7;
      border: 2px solid #F59E0B;
      box-shadow: 0 0 12px #F59E0B;
      will-change: transform, opacity;
      animation: tipLightPulse 1.8s ease-in-out infinite;
      pointer-events: none;
      z-index: 3;
    }
    @keyframes tipLightPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.85; }
      50% { transform: scale(1.22); opacity: 1; }
    }

    /* Feedback sensorial en productos y carrito */
    .floating-price-pop {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      padding: 4px 10px;
      border-radius: 9999px;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      white-space: nowrap;
      box-shadow: 0 8px 18px -4px rgba(217, 35, 42, 0.45);
      will-change: transform, opacity;
      animation: floatingPricePopAnim 750ms cubic-bezier(0.22, 1.35, 0.36, 1) forwards;
    }
    @keyframes floatingPricePopAnim {

    /* Menús superiores flotantes con Sistema Translúcido Multicapa BravoVa */
    .floating-header-capsule {
      margin: 8px 12px 6px 12px;
      border-radius: 24px;
      backdrop-filter: blur(36px) saturate(210%);
      -webkit-backdrop-filter: blur(36px) saturate(210%);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.76) 100%);
      border: 1px solid rgba(255, 255, 255, 0.94);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9), inset 0 -1px 1px rgba(255, 255, 255, 0.22), 0 12px 28px -6px rgba(217, 35, 42, 0.12);

      z-index: 25;

    }
    .floating-header-capsule::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 0;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, #D9232A 0%, #F59E0B 100%);

      pointer-events: none;
      transition: opacity 0.22s ease;

    // Utilidades de formato e índices O(1) para consulta rápida de catálogo


    function escapeText(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    const PRODUCT_MAP = new Map([...BRAVO_PRODUCTS, ...ARCA_PRODUCTS].map(p => [p.sku, p]));
    const CATEGORY_MAP = new Map();
    for (const p of PRODUCT_MAP.values()) {
      const storeKey = p.sku.startsWith("ARC-") ? "arca" : "bravo";
      const key = `${storeKey}:${p.category}`;
      if (!CATEGORY_MAP.has(key)) CATEGORY_MAP.set(key, []);
      CATEGORY_MAP.get(key).push(p);
    }
    function getProductsByCategory(catName, store = appState.activeStore) {
      return CATEGORY_MAP.get(`${store}:${catName}`) || [];
    }


    function getActiveSections() {
      return appState.activeStore === "arca" ? ARCA_SECTIONS : BRAVO_SECTIONS;
    }
    function getActiveProducts() {
      return appState.activeStore === "arca" ? ARCA_PRODUCTS : BRAVO_PRODUCTS;
    }
    function getAllProducts() {
      return [...BRAVO_PRODUCTS, ...ARCA_PRODUCTS];
    }
    function findProductBySku(sku) {
      return PRODUCT_MAP.get(sku) || null;

    }

    let isStoreSwitching = false;

    function syncAmbientBackdrop(isArcaStore = appState.activeStore === "arca") {
      const phoneFrame = document.getElementById("phoneFrame");
      const backdrop = document.getElementById("bravoAmbientBackdrop");
      if (phoneFrame) {
        phoneFrame.classList.toggle("store-arca", isArcaStore);
      }
      if (backdrop) {
        backdrop.dataset.store = isArcaStore ? "arca" : "bravo";
      }
    }

    function toggleStoreMode() {
      if (isStoreSwitching) return;
      isStoreSwitching = true;

      // Cerrar y ocultar cualquier notificación toast activa para que no aparezcan banners molestos
      const toastEl = document.getElementById("phoneToast");
      if (toastEl) toastEl.classList.add("hidden");
      if (typeof toastTimer !== "undefined" && toastTimer) {
        clearTimeout(toastTimer);
        toastTimer = null;
      }

      const vp = document.getElementById("appViewport");

      const executeSwitch = () => {
        appState.activeStore = appState.activeStore === "bravo" ? "arca" : "bravo";
        const isArca = appState.activeStore === "arca";
        syncAmbientBackdrop(isArca);

        // Ajustar categoría por defecto según la tienda seleccionada
        if (isArca) {
          appState.activeCategory = "Alimentos Secos";
        } else {
          appState.activeCategory = "Hogar y limpieza";
        }

        // Limpiar filtros y volver al inicio si estaba en vista de producto o categoría específica
        appState.homeSearchQuery = "";
        appState.catalogFilterQuery = "";
        appState.categorySearchQuery = "";
        if (["product", "category"].includes(appState.currentScreen)) {
          appState.currentScreen = "home";
        }

        renderActiveScreen();

        if (vp) {
          vp.scrollTop = 0;
          vp.classList.remove("store-switch-exit");
          vp.classList.add("store-switch-enter");
          setTimeout(() => {
            if (vp) vp.classList.remove("store-switch-enter");
            isStoreSwitching = false;
          }, 240);
        } else {
          isStoreSwitching = false;
        }
      };

      if (vp) {
        vp.classList.remove("store-switch-enter");
        vp.classList.add("store-switch-exit");
        setTimeout(executeSwitch, 130);
      } else {
        executeSwitch();
      }
    }

    function toggleBrandDropdown(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById("brandDropdownMenu");
      const chev = document.getElementById("brandDropdownChevron");
      if (!menu) return;
      const opening = menu.classList.contains("hidden");
      menu.classList.toggle("hidden");
      if (opening) {
        menu.classList.remove("animate-spring-pop");
        void menu.offsetWidth;
        menu.classList.add("animate-spring-pop");
      }
      if (chev) chev.classList.toggle("rotate-180");
    }

    function selectStoreFromDropdown(store, e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById("brandDropdownMenu");
      if (menu) menu.classList.add("hidden");
      const chev = document.getElementById("brandDropdownChevron");
      if (chev) chev.classList.remove("rotate-180");
      if (appState.activeStore !== store) {
        toggleStoreMode();
      }
    }

        try { scannerVideoTrack.stop(); } catch(e) {}
        scannerVideoTrack = null;
      }
    }

    function getCartTotals() {
      let count = 0;
      let subtotal = 0;
      appState.cart.forEach(item => {
        const p = findProductBySku(item.sku);
        if (p) {
          count += item.qty;
          subtotal += p.price * item.qty;
        }
      });
      const bravisimaGenerated = Math.floor(subtotal / 100);
      const nextHundredRemainder = 100 - (subtotal % 100);
      const progressPct = subtotal % 100;
      const redeemed = appState.redeemBravisimaInCart ? Math.min(appState.accumulatedBravisimaBalance, subtotal) : 0;
      const finalPay = Math.max(0, subtotal - redeemed);
      return { count, subtotal, bravisimaGenerated, nextHundredRemainder, progressPct, redeemed, finalPay };
    }

    let _sharedAudioCtx = null;
    function getSharedAudioCtx() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!_sharedAudioCtx) _sharedAudioCtx = new AudioCtx();
        if (_sharedAudioCtx.state === "suspended") _sharedAudioCtx.resume();
        return _sharedAudioCtx;
      } catch (e) {
        return null;
      }
    }

    function playCartAddSound() {
      try {
        const ctx = getSharedAudioCtx();
        if (!ctx) return;




        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12); // A5
        gain.gain.setValueAtTime(0.22, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.28);
      } catch(e) {}
    }

    function spawnStarBurstEffect(event) {
      try {
        let x = window.innerWidth / 2;
        let y = window.innerHeight / 2;
        if (event) {
          if (event.clientX && event.clientY) {
            x = event.clientX;
            y = event.clientY;
          } else if (event.currentTarget) {
            const rect = event.currentTarget.getBoundingClientRect();
            x = rect.left + rect.width / 2;
            y = rect.top + rect.height / 2;
          }
        }
        const starIcons = ["✨", "⭐", "🌟", "💫", "✨"];
        for (let i = 0; i < 7; i++) {
          const el = document.createElement("div");
          el.className = "star-burst-particle";
          el.textContent = starIcons[i % starIcons.length];
          el.style.left = x + "px";
          el.style.top = y + "px";
          const angle = (i / 7) * 2 * Math.PI + (Math.random() * 0.4 - 0.2);
          const dist = 32 + Math.random() * 32;
          const tx = Math.cos(angle) * dist;
          const ty = Math.sin(angle) * dist - 15;
          const txEnd = tx * 1.35;
          const tyEnd = ty * 1.45 + 18;
          el.style.setProperty("--tx", tx + "px");
          el.style.setProperty("--ty", ty + "px");
          el.style.setProperty("--tx-end", txEnd + "px");
          el.style.setProperty("--ty-end", tyEnd + "px");
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 750);
        }
      } catch(e) {}
    }

    function changeProductQty(sku, delta, event) {
      const p = findProductBySku(sku);
      if (delta > 0) {
        playCartAddSound();
        spawnStarBurstEffect(event);
        if (p) spawnFloatingPricePop(event, p.price, appState.activeStore === "arca");
      }
      const idx = appState.cart.findIndex(i => i.sku === sku);
      if (idx > -1) {
        appState.cart[idx].qty += delta;
        if (appState.cart[idx].qty <= 0) appState.cart.splice(idx, 1);
      } else if (delta > 0) {
        appState.cart.push({ sku, qty: delta });
      }
      _suppressNextCardEntrance = true;
      if (delta > 0) _lastPoppedCartSku = sku;
      renderActiveScreen();
      if (delta > 0) triggerBouncyCartPop(sku);
      _lastPoppedCartSku = null;
      if (p && delta > 0) {
        showPhoneToast("🛒", p.name + " agregado (RD$ " + p.price + ")");
      } else if (p && delta < 0) {
        const remaining = appState.cart.find(i => i.sku === sku);
        if (remaining) {
          showPhoneToast("➖", p.name + " (" + remaining.qty + " en carrito)");

        if (typeof saved.targetBudgetInChat === "number") appState.targetBudgetInChat = saved.targetBudgetInChat;
        if (Array.isArray(saved.lists) && saved.lists.length) appState.lists = saved.lists;
        if (Array.isArray(saved.orders) && saved.orders.length) appState.orders = saved.orders;
        if (Array.isArray(saved.addresses) && saved.addresses.length) appState.addresses = saved.addresses;
        if (Array.isArray(saved.paymentMethods) && saved.paymentMethods.length) appState.paymentMethods = saved.paymentMethods;

    function startVoiceSearch(mode = "home") {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (_isVoiceListening && _voiceRecognition) {
        try { _voiceRecognition.stop(); } catch (e) {}
        _isVoiceListening = false;
        syncVoiceEqUi(false);
        return;
      }
      _voiceTargetMode = mode === "chat" ? "chat" : "home";
      if (!SpeechRec) {
        const inp = document.getElementById(_voiceTargetMode === "chat" ? "chatUserInput" : "homeSearchInput");
        if (inp) inp.focus();
        showPhoneToast("🎙️", "Dicta o escribe tu consulta para Brav IA");
        return;
      }
      try {
        _voiceRecognition = new SpeechRec();
        _voiceRecognition.lang = "es-DO";
        _voiceRecognition.interimResults = false;
        _voiceRecognition.maxAlternatives = 1;
        _isVoiceListening = true;
        syncVoiceEqUi(true);
        showPhoneToast("🎙️", "Escuchando tu voz en vivo...");
        _voiceRecognition.onresult = (event) => {
          const transcript = (event.results?.[0]?.[0]?.transcript || "").trim();
          _isVoiceListening = false;
          syncVoiceEqUi(false);
          if (transcript) {
            if (_voiceTargetMode === "chat") {
              sendCustomChatMsg(transcript);
            } else {
              appState.homeSearchQuery = transcript;
              renderActiveScreen();
              showPhoneToast("✨", "Buscando: " + transcript);
            }
          }
        };
        _voiceRecognition.onerror = () => {
          _isVoiceListening = false;
          syncVoiceEqUi(false);
          showPhoneToast("⚠️", "No se pudo captar audio; escribe tu consulta");
        };
        _voiceRecognition.onend = () => {
          _isVoiceListening = false;
          syncVoiceEqUi(false);
        };
        _voiceRecognition.start();
      } catch (e) {
        _isVoiceListening = false;
        syncVoiceEqUi(false);
        showPhoneToast("🎙️", "Escribe tu consulta para Brav IA");
      }
    }

    function handleBravisimaTilt(e, el) {
      if (!el) return;
      const rect = el.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      const rotY = ((x - 0.5) * 14).toFixed(2);
      const rotX = ((0.5 - y) * 12).toFixed(2);
      el.style.transition = "transform 0.08s ease-out";
      el.style.transform = `perspective(900px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale3d(1.015, 1.015, 1.015)`;
      const glare = el.querySelector(".bravisima-holo-glare");
      if (glare) {
        const angle = Math.round(Math.atan2(y - 0.5, x - 0.5) * (180 / Math.PI) + 135);
        glare.style.opacity = "0.9";
        glare.style.transform = `translate3d(${((x - 0.5) * 32).toFixed(1)}px, ${((y - 0.5) * 32).toFixed(1)}px, 0) rotate(${angle}deg)`;
      }
    }

    function resetBravisimaTilt(el) {
      if (!el) return;
      el.style.transition = "transform 0.5s var(--spring-bouncy)";
      el.style.transform = "perspective(900px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
      const glare = el.querySelector(".bravisima-holo-glare");
      if (glare) {
        glare.style.opacity = "0";
        glare.style.transform = "translate3d(0, 0, 0) rotate(135deg)";
      }
    }

      const vp = document.getElementById("appViewport");

      header.classList.toggle("is-scrolled", vp.scrollTop > 18);

        };

      if (savedFocus) {
        const targetInput = document.getElementById(savedFocus.id);

              targetInput.setSelectionRange(savedFocus.start, savedFocus.end);
            }
          } catch (e) {}

      }

      const points = [
        { x: 45, y: 40, speed: "26 km/h", eta: "11 min", dist: "1.4 km" },
        { x: 45, y: 75, speed: "30 km/h", eta: "10 min", dist: "1.3 km" },
        { x: 45, y: 105, speed: "32 km/h", eta: "9 min", dist: "1.1 km" },
        { x: 90, y: 105, speed: "28 km/h", eta: "8 min", dist: "0.9 km" },
        { x: 135, y: 105, speed: "29 km/h", eta: "7 min", dist: "0.8 km" },
        { x: 135, y: 140, speed: "31 km/h", eta: "6 min", dist: "0.6 km" },
        { x: 135, y: 175, speed: "27 km/h", eta: "4 min", dist: "0.4 km" },
        { x: 195, y: 175, speed: "22 km/h", eta: "2 min", dist: "0.2 km" },
        { x: 235, y: 175, speed: "15 km/h", eta: "1 min", dist: "80 m" }
      ];
      deliverySimInterval = setInterval(() => {
        if (appState.currentScreen !== "delivery") {
          clearInterval(deliverySimInterval);
          deliverySimInterval = null;
          return;
        }
        step = (step + 1) % points.length;
        const pt = points[step];
        const marker = document.getElementById("animatedDeliveryScooterGroup");
        const speedEl = document.getElementById("liveDeliverySpeedBadge");
        const etaEl = document.getElementById("liveDeliveryEtaText");
        const distEl = document.getElementById("liveDeliveryDistText");
        if (marker) marker.setAttribute("transform", `translate(${pt.x}, ${pt.y})`);
        if (speedEl) speedEl.textContent = pt.speed;
        if (etaEl) etaEl.innerHTML = `Llegada estimada: <strong>${pt.eta}</strong>`;
        if (distEl) distEl.textContent = `${pt.dist} restantes`;
      }, 2500);
    }

    function applyBudgetInChat(optimizeExisting) {
      const limit = appState.targetBudgetInChat;
      const isArca = appState.activeStore === "arca";
      const essentials = isArca
        ? ["ARC-001", "ARC-009", "ARC-012", "ARC-015", "ARC-021", "ARC-025", "ARC-028", "ARC-010"]
        : ["BRV-053", "BRV-055", "BRV-075", "BRV-096", "BRV-009", "BRV-098", "BRV-020", "BRV-019", "BRV-002", "BRV-037"];
      let chosen = [];
      let sum = 0;
      essentials.forEach(sku => {
        const p = findProductBySku(sku);
        if (p && sum + p.price <= limit) {
          chosen.push(sku);
          sum += p.price;
        }
      });
      appState.cart = chosen.map(sku => ({ sku, qty: 1 }));
      const cashback = Math.floor(sum / 100);
      const storeName = isArca ? "El Arca Petshop" : "Marca Bravo";
      appState.chatHistory.push({
        sender: "user",
        text: optimizeExisting ? `Ajustar mi carrito actual para no pasarme de RD$ ${limit}` : `Armar una compra inteligente dentro de RD$ ${limit}`
      });
      appState.chatHistory.push({
        sender: "ai",
        text: `¡Listo! Ajusté tu carrito con **${chosen.length} productos esenciales ${storeName}** por un total exacto de **RD$ ${sum}.00** (quedas **RD$ ${limit - sum}** por debajo de tu presupuesto de RD$ ${limit} y acumulas **+RD$ ${cashback}** en tu Tarjeta Bravísima).`,
        skus: chosen
      });
      renderActiveScreen();
      showPhoneToast("💰", `Carrito ajustado a RD$ ${sum}.00`);

    }

    function addAiBundleToCart(msgIdx) {
      const msg = appState.chatHistory[msgIdx];
      if (!msg || !msg.skus) return;
      msg.skus.forEach(sku => changeProductQty(sku, 1));
      showPhoneToast("✨", "Productos de Brav IA agregados al carrito");
    }

    function formatAiText(str) {
      if (!str) return "";
      return str
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n\n/g, '<br/><br/>')
        .replace(/\n/g, '<br/>');
    }

    function scrollChatToBottom() {
      const vp = document.getElementById("appViewport");
      if (vp) {
        setTimeout(() => {
          vp.scrollTo({ top: vp.scrollHeight, behavior: "smooth" });
        }, 50);
      }
    }

    function isValidGeminiApiKey(key) {
      return typeof key === "string" && key.trim().length >= 20;
    }

    function saveGeminiApiKeyFromInput() {
      const inp = document.getElementById("geminiApiKeyInput");
      if (!inp) return;
      const val = inp.value.trim();
      if (val) {
        appState.geminiApiKey = val;
        localStorage.setItem("GEMINI_API_KEY", val);
        showPhoneToast("✨", "API Key de Gemini guardada y conectada");
      } else {
        localStorage.removeItem("GEMINI_API_KEY");
        appState.geminiApiKey = "";
        showPhoneToast("✨", "Gemini Live restablecido con clave oficial");
      }
      renderActiveScreen();
    }

            parts: userParts
          }],

              signal: controller.signal
            });

            clearTimeout(timeoutId);

            const data = await res.json();

            const rawText = parts.map(p => p.text || "").join("\n").trim();
            if (!rawText) throw new Error("Respuesta vacía recibida");

            const skuMatch = rawText.match(/[\*\s_]*SKUS?[\*\s_:]*\[(.*?)\]/i);
            let skus = [];
            if (skuMatch && skuMatch[1]) {
              skus = skuMatch[1].split(",").map(s => s.trim().replace(/['"`]/g, "")).filter(s => Boolean(findProductBySku(s)));

              .replace(/\[(?:BRV|ARC)-\d{3}\]\s*/g, "")
              .trim();

            return {

            if (useTools) continue;

    async function sendCustomChatMsg(customQuery = null) {
      if (appState.isAiGenerating) return;

      const inp = document.getElementById("chatUserInput");
      const q = (customQuery || (inp ? inp.value : "")).trim();
      if (!q) return;
      if (inp) inp.value = "";

      appState.isAiGenerating = true;

      // 1. Agregar mensaje del usuario a la vista
      appState.chatHistory.push({ sender: "user", text: q });

      // 2. Agregar mensaje de carga de Brav IA
      const loadingIdx = appState.chatHistory.length;
      appState.chatHistory.push({
        sender: "ai",
        loading: true,
        text: "✨ Gemini Live está preparando tu respuesta..."
      });
      renderActiveScreen();
      scrollChatToBottom();

      const startTime = performance.now();
      let aiResult = null;

      try {
        const apiKey = (appState.geminiApiKey || (typeof localStorage !== "undefined" && localStorage.getItem("GEMINI_API_KEY")) || "").trim();

        // 1. Si hay una API Key oficial válida (AIza...), probar llamada en vivo con Gemini
        if (isValidGeminiApiKey(apiKey)) {

            aiResult = await callLiveGeminiApi(q, apiKey);
          } catch(apiErr) {
            console.warn("Fallo en Gemini Live API, activando Motor Experto Dominicano:", apiErr);
          }
        }

        // 2. Si no hay API Key o la conexión falló, responder al instante con el Motor Experto
        if (!aiResult) {
          await new Promise(r => setTimeout(r, 280));
          aiResult = generateBravIaLocalResponse(q);
        }

        const duration = Math.round(performance.now() - startTime);

        appState.chatHistory[loadingIdx] = {
          sender: "ai",
          text: aiResult.text,
          skus: aiResult.skus,
          model: aiResult.model,
          durationMs: duration
        };

      layer.className = "absolute inset-0 z-[60] pointer-events-none overflow-hidden";

      const flash = document.createElement("div");
      flash.className = "checkout-confirm-flash";

      const colors = isArca
        ? ["#0D9488", "#F59E0B", "#10B981"]
        : ["#D9232A", "#F59E0B", "#10B981"];

      for (let i = 0; i < 24; i++) {
        const piece = document.createElement("div");
        piece.className = "checkout-confetti-piece";
        const color = colors[i % colors.length];
        const angle = (i / 24) * Math.PI * 2 + (Math.random() * 0.35 - 0.175);
        const spread = 75 + Math.random() * 115;
        const cx = Math.round(Math.cos(angle) * spread);
        const cy = Math.round(Math.sin(angle) * spread - 65);
        const cfall = Math.round(cy + 165 + Math.random() * 140);
        const crot = Math.round((Math.random() > 0.5 ? 1 : -1) * (240 + Math.random() * 300));
        const dur = Math.round(820 + Math.random() * 280);
        const delay = Math.round(Math.random() * 90);
        piece.style.setProperty("--cx", `${cx}px`);
        piece.style.setProperty("--cy", `${cy}px`);
        piece.style.setProperty("--cfall", `${cfall}px`);
        piece.style.setProperty("--crot", `${crot}deg`);
        piece.style.setProperty("--cdur", `${dur}ms`);
        piece.style.setProperty("--cdelay", `${delay}ms`);
        const shapeType = i % 3;
        if (shapeType === 0) {
          piece.innerHTML = `<svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="2" width="8" height="5" rx="2" fill="${color}"/></svg>`;

        }
        layer.appendChild(piece);
      }

      frame.appendChild(layer);
      setTimeout(() => { if (layer.parentNode) layer.remove(); }, 1250);

    let scannerVideoTrack = null;

    function playLaserBeep() {
      try {
        const ctx = getSharedAudioCtx();
        if (!ctx) return;





        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(1850, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1920, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.12);
      } catch(e) {}
    }

        try { scannerVideoTrack.stop(); } catch(e) {}

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } }
        });
        if (video) {
          video.srcObject = stream;
          video.classList.remove("hidden");
          scannerVideoTrack = stream.getVideoTracks()[0];
        }
        if (sim) sim.classList.add("hidden");
        if (label) label.textContent = "Simulador";

            <button onclick="closeBarcodeScannerModal(); openProductDetail('${p.sku}');" class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-[10.5px] hover:bg-slate-200 transition cursor-pointer">
              Detalles
            </button>
          </div>
        `;
      }

      setTimeout(() => {
        if (reticle) {
          reticle.classList.remove("border-emerald-400", "bg-emerald-500/10");
          reticle.classList.add("border-red-500/80");
        }
        if (status) {
          status.className = "px-2 py-0.5 rounded-full bg-red-600/80 backdrop-blur-md text-white font-extrabold text-[9px] uppercase tracking-wider animate-pulse";
          status.textContent = "Alineando código...";
        }
      }, 1600);
    }

    function openBarcodeScannerModal(initialSku = "BRV-001") {

      const realImg = getProductImageUrl(p.sku);

              </div>
            </div>
            <button onclick="closeBarcodeScannerModal()" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 dm-text font-bold text-xs flex items-center justify-center hover:bg-slate-200 transition cursor-pointer">✕</button>
          </div>

          <!-- VISOR DE CÁMARA (CÁMARA REAL O SIMULACIÓN ULTRA-REALISTA HD) -->
          <div class="relative w-full h-56 rounded-3xl overflow-hidden bg-slate-950 border border-slate-700/80 shadow-2xl flex items-center justify-center select-none">
            
            <!-- Video en vivo si el usuario activa la cámara del equipo -->
            <video id="scannerLiveVideo" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>

            <!-- Fondo simulado de cámara con imagen real de producto -->
            <div id="simulatedCameraFeed" class="absolute inset-0 flex items-center justify-center bg-radial from-slate-800 to-black p-3">
              <div class="relative w-44 h-44 rounded-2xl overflow-hidden flex flex-col items-center justify-center shadow-lg border border-white/10 bg-slate-900/60">
                ${realImg ? `<img id="simFeedImg" src="${realImg}" alt="Producto" class="w-full h-full object-cover filter brightness-90 contrast-105" />` : `<div id="simFeedSvg" class="w-28 h-28">${getProductArtworkSvg(p, "w-28 h-28")}</div>`}
                <div class="absolute bottom-2 inset-x-3 bg-white/95 rounded-xl px-2 py-1 shadow-md flex flex-col items-center">
                  <svg class="w-full h-7" viewBox="0 0 100 24" fill="#000"><rect x="2" y="2" width="2" height="20"/><rect x="6" y="2" width="4" height="20"/><rect x="13" y="2" width="2" height="20"/><rect x="17" y="2" width="5" height="20"/><rect x="25" y="2" width="3" height="20"/><rect x="31" y="2" width="1" height="20"/><rect x="35" y="2" width="4" height="20"/><rect x="42" y="2" width="2" height="20"/><rect x="47" y="2" width="5" height="20"/><rect x="55" y="2" width="3" height="20"/><rect x="61" y="2" width="2" height="20"/><rect x="66" y="2" width="4" height="20"/><rect x="73" y="2" width="2" height="20"/><rect x="78" y="2" width="5" height="20"/><rect x="86" y="2" width="3" height="20"/><rect x="92" y="2" width="3" height="20"/></svg>
                  <span id="simFeedSku" class="text-[8px] font-mono font-black text-slate-800 tracking-widest">${p.sku}</span>
                </div>
              </div>
            </div>

            <!-- HAZ LÁSER ROJO CON ANIMACIÓN VERTICAL -->
            <div id="scannerLaserLine" class="scanner-laser-beam"></div>

            <!-- HUD NEÓN RETÍCULA DE ENFOQUE -->
            <div id="scannerHudReticle" class="absolute w-48 h-48 rounded-2xl border-2 border-red-500/80 scanner-reticle pointer-events-none flex flex-col justify-between p-1 transition-all duration-300">
              <div class="flex justify-between">
                <div class="w-4 h-4 border-t-2 border-l-2 border-red-500 rounded-tl"></div>
                <div class="w-4 h-4 border-t-2 border-r-2 border-red-500 rounded-tr"></div>
              </div>
              <div class="flex justify-center">
                <span id="scannerStatusText" class="px-2 py-0.5 rounded-full bg-red-600/80 backdrop-blur-md text-white font-extrabold text-[9px] uppercase tracking-wider animate-pulse">Alineando código...</span>
              </div>
              <div class="flex justify-between">
                <div class="w-4 h-4 border-b-2 border-l-2 border-red-500 rounded-bl"></div>
                <div class="w-4 h-4 border-b-2 border-r-2 border-red-500 rounded-br"></div>
              </div>
            </div>

            <!-- OVERLAY LINTERNA -->
            <div id="scannerTorchOverlay" class="absolute inset-0 bg-white/20 pointer-events-none hidden transition-opacity"></div>

            <!-- CONTROLES SUPERIORES (LINTERNA & CÁMARA REAL CON SISTEMA TRANSLÚCIDO BRAVOVA) -->
            <div class="absolute top-2.5 right-2.5 flex items-center gap-2 z-30">
              <button onclick="toggleScannerTorch()" id="scannerTorchBtn" class="bravo-glass-fab w-8 h-8 rounded-full text-slate-800 dark:text-white flex items-center justify-center cursor-pointer shadow-md" title="Encender / Apagar Linterna">
                <span class="text-sm">🔦</span>
              </button>
              <button onclick="toggleScannerLiveCamera()" id="scannerCamBtn" class="bravo-glass-fab px-2.5 h-8 rounded-full text-slate-800 dark:text-white flex items-center gap-1 text-[10px] font-bold cursor-pointer shadow-md" title="Activar/Desactivar Cámara Real del Dispositivo">





                <span class="text-sm">📷</span>
                <span id="scannerCamLabel">Cámara Real</span>
              </button>
            </div>
          </div>

          <!-- APUNTAR CÁMARA A OTROS PRODUCTOS -->
          <div>
            <span class="dm-muted text-[10px] font-bold text-slate-400 block mb-1.5 uppercase tracking-wider">Apunta la cámara a un artículo:</span>
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
              <button onclick="simulateScanProduct('BRV-001')" class="px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-950/40 text-xs font-bold text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shrink-0 transition cursor-pointer active:scale-95">
                🍖 Salami ($499)
              </button>
              <button onclick="simulateScanProduct('BRV-017')" class="px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-950/40 text-xs font-bold text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shrink-0 transition cursor-pointer active:scale-95">
                🧻 Papel Bravo ($379)
              </button>
              <button onclick="simulateScanProduct('BRV-009')" class="px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-950/40 text-xs font-bold text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shrink-0 transition cursor-pointer active:scale-95">
                🍞 Pan Viga ($99)
              </button>
              <button onclick="simulateScanProduct('ARC-001')" class="px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-teal-50 dark:hover:bg-teal-950/40 text-xs font-bold text-teal-700 dark:text-teal-300 border border-teal-200 shrink-0 transition cursor-pointer active:scale-95">
                🐾 Alimento Arca ($620)
              </button>
            </div>
          </div>

          <!-- TARJETA DEL PRODUCTO DETECTADO -->
          <div id="scannedProductResultCard" class="dm-surface bg-white dark:bg-slate-900 rounded-[22px] p-3 border border-slate-200/90 dark:border-slate-700 shadow-bravo-glow flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center shrink-0 overflow-hidden shadow-xs">
                ${getProductArtworkSvg(p, "w-11 h-11")}
              </div>
              <div class="min-w-0">
                <span class="text-[9.5px] font-extrabold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 block flex items-center gap-1">
                  <span>✓ DETECTADO</span>
                  <span class="text-slate-400 font-normal">| ${p.sku}</span>
                </span>
                <h4 class="dm-text font-bold text-xs truncate text-slate-900">${p.name}</h4>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="font-extrabold text-sm text-[#D9232A]">RD$ ${p.price}</span>
                  <span class="text-[10px] font-bold text-amber-500 bg-amber-50 dark:bg-amber-950/50 px-1.5 py-0.2 rounded-full">+RD$ ${Math.floor(p.price / 100)} Bravísima</span>
                </div>
              </div>
            </div>
            <div class="flex flex-col gap-1.5 shrink-0">
              <button onclick="changeProductQty('${p.sku}', 1); closeBarcodeScannerModal();" class="px-3 py-1.5 rounded-full bg-gradient-to-r from-[#D9232A] to-red-600 hover:brightness-110 text-white font-extrabold text-xs shadow-md active:scale-95 transition cursor-pointer">
                + Agregar
              </button>
              <button onclick="closeBarcodeScannerModal(); openProductDetail('${p.sku}');" class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-[10.5px] hover:bg-slate-200 transition cursor-pointer">
                Detalles
              </button>
            </div>
          </div>
        </div>
      `;

      content.classList.remove("animate-spring-pop");
      void content.offsetWidth;
      content.classList.add("animate-spring-pop");
      overlay.classList.remove("hidden");
      playLaserBeep();
      if (navigator.vibrate) navigator.vibrate([40, 20, 60]);
    }

    let toastTimer = null;
    function showPhoneToast(icon, msg) {
      const el = document.getElementById("phoneToast");
      if (!el) return;
      document.getElementById("phoneToastIcon").textContent = icon;
      document.getElementById("phoneToastMsg").textContent = msg;
      el.classList.remove("hidden", "animate-spring-pop");
      void el.offsetWidth;
      el.classList.add("animate-spring-pop");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add("hidden"), 2400);
    }

    function updateRealTimeClock() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, "0");
      h = h % 12 || 12;
      const el = document.getElementById("livePhoneClock");
      if (el) el.textContent = `${h}:${m}`;
    }

    function updateBatteryUI(battery) {
      if (!battery) return;
      window.lastBatteryObj = battery;
      const pct = Math.max(5, Math.round(battery.level * 100));
      const fillEl = document.getElementById("batteryFill");
      const boltEl = document.getElementById("batteryBolt");
      const isDark = appState.darkMode;
      if (fillEl) {
        fillEl.style.width = pct + "%";
        if (battery.charging) {
          fillEl.style.background = "#34C759";
          fillEl.style.opacity = "0.95";
        } else if (pct <= 20) {
          fillEl.style.background = "#FF3B30";
          fillEl.style.opacity = "0.95";
        } else {
          fillEl.style.background = isDark ? "#FFFFFF" : "#1C1C1E";
          fillEl.style.opacity = "0.88";
        }
      }
      if (boltEl) {
        boltEl.style.display = battery.charging ? "block" : "none";
        boltEl.style.color = isDark ? "#10B981" : "#15803D";
      }
    }

    function initBattery() {
      if ("getBattery" in navigator) {
        navigator.getBattery().then(battery => {
          updateBatteryUI(battery);
          battery.addEventListener("levelchange", () => updateBatteryUI(battery));
          battery.addEventListener("chargingchange", () => updateBatteryUI(battery));
        });
      }
    }




    window.addEventListener("DOMContentLoaded", () => {
      loadAppStateFromStorage();
      updateRealTimeClock();

      setInterval(updateRealTimeClock, 1000);
      initBattery();

      renderActiveScreen();

      const vp = document.getElementById("appViewport");
      if (vp) {
        vp.addEventListener("scroll", scheduleHeaderScrollUpdate, { passive: true });
      }

      // Cerrar selector de marcas en el header al hacer clic o scroll fuera
      document.addEventListener("click", (e) => {
        const sw = document.getElementById("headerBrandSwitcher");
        if (sw && !sw.contains(e.target)) {
          const menu = document.getElementById("brandDropdownMenu");
          if (menu) menu.classList.add("hidden");
          const chev = document.getElementById("brandDropdownChevron");
          if (chev) chev.classList.remove("rotate-180");
        }
      });
    });
  </script>
