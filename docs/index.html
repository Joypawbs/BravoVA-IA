<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BravoVa — réplica web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script type="module" src="firebase.js?v=6"></script>
<script src="product_info.js?v=5"></script>
<style>
/*
VOICE: la app BravoVa tal cual, réplica fiel de la versión Android (Compose) en tamaño de teléfono.
IDEA: un teléfono; la página es la app.
PICTURE: la propia interfaz.
COLOUR and TYPE: tema de la app (BravoRed #D9232A, ámbar, fondo crema/noche), Fredoka + Nunito.
LAYOUT: lienzo de 430px centrado en escritorio, pantalla completa en móvil.
*/
:root{
  --red:#D9232A;--amber:#F59E0B;--teal:#0F766E;--emerald:#14B8A6;
  --bg:#FFF7ED;--surface:#FFFFFF;--surfVar:#F1F5F9;--border:#E2E8F0;--ink:#0F172A;--ink2:#475569;
  --card:rgba(255,255,255,.80);--cardBorder:rgba(15,23,42,.08);--dockBg:rgba(255,255,255,.78);
  --primary:var(--red);--onPrimary:#fff;--artBg:#F1F5F9;--badgeCard:rgba(255,255,255,.94);--badgeInk:#0F172A;
  --inactive:#1E293B;
}
:root.dark{
  --bg:#090D16;--surface:#111827;--surfVar:#162032;--border:#283548;--ink:#F8FAFC;--ink2:#CBD5E1;
  --card:rgba(22,32,50,.72);--cardBorder:rgba(255,255,255,.08);--dockBg:rgba(17,24,39,.78);
  --primary:#E77277;--onPrimary:#0F172A;--artBg:#111927;--badgeCard:#1E293B;--badgeInk:#E2E8F0;--inactive:#94A3B8;
}
:root.arca{--primary:var(--teal);--onPrimary:#fff}
:root.dark.arca{--primary:#5FA39C}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#05070c;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
.app{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;background:var(--bg);transition:background .26s}
@media(min-width:600px){body{align-items:center;padding:20px}.app{height:min(932px,calc(100dvh - 40px));border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #10131b,0 0 0 11px #2a2f3b}}
.disp{font-family:'Fredoka','Nunito',sans-serif}
.ambient{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(2px);animation:drift 12s linear infinite}
@keyframes drift{0%{transform:translate(0,0) scale(1)}25%{transform:translate(6%,4%) scale(1.06)}50%{transform:translate(0,8%) scale(1)}75%{transform:translate(-6%,4%) scale(.94)}100%{transform:translate(0,0) scale(1)}}
.view{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:188px}
.scroll::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center}
.ul{height:3px;width:34px;border-radius:99px;background:linear-gradient(90deg,var(--amber),var(--primary));margin-top:3px}
.arca .ul{background:linear-gradient(90deg,var(--emerald),var(--teal))}
.tcard{background:var(--card);border:1px solid var(--cardBorder);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none;scroll-snap-align:start}
svg.i{width:1em;height:1em;flex:none}
/* header */
.hdr{padding:6px 14px 6px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:5}
.brandbtn{display:flex;align-items:center;gap:4px;background:none;border:0;padding:4px 2px}
.logoB{font-family:'Fredoka';font-weight:700;font-size:30px;letter-spacing:-.5px;color:#F97316;line-height:1}
.logoB b{color:#22C55E;font-size:14px;vertical-align:top}
.logoA{font-family:'Fredoka';font-weight:700;font-size:26px;color:var(--teal);line-height:1}
.enruta{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:rgba(5,150,105,.12);border:1px solid rgba(5,150,105,.35);color:#059669;font-weight:800;font-size:11px}
.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:999px;background:var(--surface);border:1px solid var(--border);padding:0 8px 0 14px;transition:box-shadow .2s}
.search:focus-within{box-shadow:0 0 0 1.4px var(--primary),0 0 22px color-mix(in srgb,var(--primary) 22%,transparent)}
.search input{flex:1;border:0;background:transparent;outline:0;color:var(--ink);font:600 14px 'Nunito';height:100%}
.search input::placeholder{color:var(--ink2);opacity:.8}
.iconbtn{width:30px;height:30px;border-radius:50%;border:0;background:var(--surfVar);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:16px}
.prog{height:2.5px;border-radius:9px;background:color-mix(in srgb,var(--primary) 12%,transparent)}
.prog>div{height:100%;border-radius:9px;background:var(--primary);width:6%;transition:width .2s}
.storeMenu{position:absolute;left:14px;top:52px;width:240px;padding:8px;border-radius:20px;background:var(--dockBg);border:1px solid var(--cardBorder);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 18px 40px rgba(0,0,0,.25);z-index:20;display:none}
.storeMenu.open{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-6px)}to{opacity:1;transform:none}}
.storeOpt{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:14px;border:0;background:none;text-align:left}
.storeOpt.on{background:color-mix(in srgb,var(--primary) 12%,transparent)}
.storeOpt small{display:block;color:var(--ink2);font-size:11px;font-weight:700}
/* section header */
.sec{padding-top:14px}
.sech{display:flex;justify-content:space-between;align-items:center;padding:0 14px;margin-bottom:10px}
.secic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--primary) 12%,transparent);border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);color:var(--primary);font-size:18px;flex:none}
.sect{font-family:'Fredoka';font-weight:600;font-size:17px}
.vt{display:flex;align-items:center;gap:1px;color:var(--primary);font-weight:800;font-size:12px;background:none;border:0;padding:4px 8px;border-radius:99px}
/* product card */
.pc{width:112px;height:218px;border-radius:18px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.pc:active{transform:scale(.97)}
.grid3 .pc{width:auto}
.meta{display:flex;align-items:center;gap:3px;font-size:8px;font-weight:900;letter-spacing:.3px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.meta i{font-style:normal;color:var(--primary);transform:skewX(-14deg);display:inline-block}
.fav{border:0;background:none;padding:0;color:var(--ink2);opacity:.65;font-size:15px;display:flex}
.fav.on{color:var(--primary);opacity:1}
.art{height:80px;margin:3px 4px 2px;border-radius:12px;position:relative;overflow:hidden;background:color-mix(in srgb,var(--artBg) 72%,transparent);border:1px solid var(--cardBorder)}
.art img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;border-radius:10px}
.vec{position:absolute;inset:2px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.vec .sh{position:absolute}
.vec .lab{position:relative;text-align:center;line-height:1.1}
.vec .lab b{display:block;font-weight:900;font-size:11px}
.vec .lab span{display:block;font-weight:800;font-size:6.5px;color:var(--badgeInk);max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn{height:30px;font-weight:700;font-size:10px;line-height:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;cursor:pointer}
.pr{display:flex;justify-content:space-between;align-items:center;height:30px}
.price{font-family:'Fredoka';font-weight:700;font-size:11px;white-space:nowrap}
.add{width:25px;height:25px;border-radius:50%;border:1.4px solid var(--primary);background:var(--surface);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:14px;padding:0}
.qty{display:flex;align-items:center;gap:2px;border-radius:99px;padding:2px;background:color-mix(in srgb,var(--primary) 10%,transparent);border:1px solid color-mix(in srgb,var(--primary) 40%,transparent)}
.qty button{width:20px;height:20px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;font-size:11px;padding:0}
.qty .m{background:var(--surface);color:var(--primary)}.qty .p{background:var(--primary);color:#fff}
.qty span{color:var(--primary);font-weight:900;font-size:10px;padding:0 2px}
.hr{height:1px;background:var(--border);opacity:.6;margin:2px 0}
.foot{display:flex;justify-content:space-between;font-size:8px;font-weight:800;color:var(--ink2)}
.pulse{animation:pulse .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pulse{0%{transform:scale(1.22)}100%{transform:scale(1)}}
/* offers */
.offc{width:220px;padding:12px;border-radius:18px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;font-weight:800;font-size:11.5px;color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 32%,transparent);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.chip.alt{background:var(--surfVar);border-color:transparent}
/* dock */
.dock{position:absolute;left:16px;right:16px;bottom:calc(8px + env(safe-area-inset-bottom));height:58px;border-radius:999px;background:var(--dockBg);border:1.15px solid color-mix(in srgb,var(--primary) 22%,var(--cardBorder));backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 10px 26px color-mix(in srgb,var(--primary) 18%,rgba(0,0,0,.18));display:flex;align-items:center;justify-content:space-evenly;padding:0 8px;z-index:30;transition:transform .24s,opacity .2s}
.dock.hide{transform:translateY(120%);opacity:0}
.dk{flex:1;height:48px;border:0;background:none;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--inactive);font-size:25px}
.dk.on{color:var(--primary)}
.dk.on::before{content:"";position:absolute;inset:4px;border-radius:999px;background:color-mix(in srgb,var(--primary) 13%,transparent);border:.8px solid color-mix(in srgb,var(--primary) 28%,transparent)}
:root.dark .dk.on::before{background:color-mix(in srgb,var(--primary) 22%,transparent)}
.dk.on::after{content:"";position:absolute;top:3px;left:50%;width:24px;height:3px;margin-left:-12px;border-radius:9px;background:var(--primary)}
.dk svg{position:relative;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.dk.on svg{transform:scale(1.16)}
.dk .spark{position:absolute;font-size:11px;color:var(--amber);top:9px;right:calc(50% - 18px)}
/* fabs */
.fabs{position:absolute;right:14px;bottom:calc(82px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:29;transition:transform .24s,opacity .2s}
.fabs.hide{transform:translateY(160%);opacity:0;pointer-events:none}
.fab{width:48px;height:48px;border-radius:50%;border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);background:var(--dockBg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:20px;box-shadow:0 8px 20px rgba(0,0,0,.18);position:relative}
.fab .bd[hidden]{display:none}
.fab .bd{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font:900 10px 'Nunito';display:flex;align-items:center;justify-content:center}
/* toast */
.toast{position:absolute;top:calc(10px + env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:center;z-index:60;pointer-events:none;transition:transform .3s,opacity .3s;transform:translateY(-140%);opacity:0}
.toast.show{transform:none;opacity:1}
.toast div{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(15,23,42,.56);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font:700 12px 'Fredoka';box-shadow:0 12px 30px rgba(0,0,0,.3)}
/* buttons */
.pbtn{width:100%;height:46px;border-radius:999px;border:0;background:var(--primary);color:var(--onPrimary);font:600 14px 'Fredoka';display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 30%,transparent);transition:transform .15s}
.pbtn:active{transform:scale(.97)}
.obtn{width:100%;height:46px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:600 14px 'Fredoka';display:flex;align-items:center;justify-content:center;gap:8px}
.aura{position:relative}
.aura::before{content:"";position:absolute;inset:-1.6px;border-radius:inherit;padding:1.6px;background:conic-gradient(from var(--a,0deg),#D9232A,#F59E0B,#10B981,#06B6D4,#3B82F6,#D9232A);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.orb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,transparent 9%),conic-gradient(from var(--a,0deg),#D9232A,#F59E0B,#10B981,#3B82F6,#D9232A);animation:spin 4s linear infinite;box-shadow:0 0 18px rgba(245,158,11,.45);flex:none}
/* splash + auth */
.splash{background:radial-gradient(70% 45% at 50% 38%,#3A1208 0%,#12080A 45%,#06080E 75%);color:#F8FAFC;align-items:center;justify-content:center;gap:22px;z-index:80;transition:opacity .4s}
.appicon{width:132px;height:132px;border-radius:34px;background:linear-gradient(145deg,#F97316,#E5231B 70%);box-shadow:0 18px 50px rgba(234,88,12,.45);display:flex;align-items:center;justify-content:center;font:700 86px/1 'Fredoka';color:#fff;animation:breath 1.6s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.05)}}
.star{position:absolute;color:#FDE68A;animation:tw 1.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.3;transform:scale(.7)}}
.loadbar{width:250px;padding:10px 14px 12px;border-radius:16px;background:rgba(21,30,46,.75);border:1px solid #2A3650}
.loadbar .t{height:4px;border-radius:9px;background:#2A3650;overflow:hidden}
.loadbar .t div{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#B91C1C,#EF4444);animation:fill 1.6s ease-out forwards}
@keyframes fill{to{width:100%}}
.auth{align-items:stretch;justify-content:center;padding:20px 16px;overflow-y:auto}
.authcard{border-radius:26px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.feat{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:14px;background:color-mix(in srgb,var(--surfVar) 60%,transparent)}
.feat .ic{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary);font-size:17px}
.feat b{font-family:'Fredoka';font-weight:600;font-size:13.5px;display:block}
.feat span{font-size:11.5px;color:var(--ink2);font-weight:600}
.logo{display:block;object-fit:contain}
.chathdr{margin:6px 12px 0;height:56px;border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 10px}
.cbtn{height:26px;padding:0 9px;border-radius:999px;background:var(--surfVar);border:1px solid var(--border);color:var(--ink);font:500 11px 'Fredoka';display:flex;align-items:center;gap:4px}
.msg{max-width:88%;padding:10px 12px;border-radius:16px;font-size:13px;font-weight:600;line-height:1.5;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--primary);color:var(--onPrimary);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;border-bottom-left-radius:6px}
.msg .lbl{font:600 10px 'Fredoka';color:var(--primary);margin-bottom:4px;display:block}
.inbar{position:absolute;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));height:50px;border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;z-index:28}
.inbar input{flex:1;border:0;background:transparent;outline:0;color:var(--ink);font:600 13px 'Nunito'}
.send{width:38px;height:38px;border-radius:50%;border:0;background:var(--primary);color:var(--onPrimary);display:flex;align-items:center;justify-content:center;font-size:16px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);margin-right:3px;animation:tw 1s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 24px;color:var(--ink2);font-weight:700}
/* ronda 2: cabecera cápsula, catálogo, categoría, detalle, carrito, biometría */
.caphdr{position:absolute;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;z-index:6;border-radius:24px;padding:10px 12px 9px;display:flex;flex-direction:column;gap:8px;transition:gap .2s,padding .2s;box-shadow:0 10px 28px rgba(0,0,0,.14)}
.caphdr.sc{gap:5px;padding:7px 12px 6px}
.caphdr .cht{font-size:16.5px;transition:font-size .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caphdr.sc .cht{font-size:15px}
.backbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surfVar);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.seccard{margin:0 14px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .15s}
.seccard:active,.ccard:active{transform:scale(.985)}
.meta.wrap{white-space:normal;flex-wrap:wrap;row-gap:2px}
.art.big img{inset:11px;width:calc(100% - 22px);height:calc(100% - 22px)}
.rbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surfVar);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.rbtn.favon{background:#FFE4E6;border:1px solid rgba(225,29,72,.4);color:#E11D48}
.hl{padding:4px 9px;border-radius:999px;font-size:10px;font-weight:800;background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent)}
.tip{padding:9px 12px;border-radius:14px;background:color-mix(in srgb,var(--surfVar) 70%,transparent);font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.45}
.algc{padding:4px 9px;border-radius:999px;font-size:10.5px;font-weight:800}
.stepper{width:32px;height:32px;border-radius:50%;border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);background:var(--surface);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:17px;padding:0}
.stepper.p{background:var(--primary);color:#fff;border:0}
.dangerbtn{height:46px;padding:0 16px;border-radius:999px;border:1.5px solid #E11D48;background:#FFE4E6;color:#BE123C;font:600 13.5px 'Fredoka';display:flex;align-items:center;gap:6px;flex:none}
:root.dark .dangerbtn{background:#4C0519;color:#FDA4AF}
.ccard{margin:0 14px;padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s}
.opt{flex:1;display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;border:1px solid color-mix(in srgb,var(--ink2) 25%,transparent);background:color-mix(in srgb,var(--surfVar) 45%,transparent);text-align:left;color:var(--ink)}
.opt.on{border:1.4px solid var(--primary);background:color-mix(in srgb,var(--primary) 15%,transparent)}
.opt.on b,.opt.on svg{color:var(--primary)}
.opt b{display:block;font:600 11.5px 'Fredoka'}
.opt small{display:block;font-size:10px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncf{flex:1;padding:8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ink2) 25%,transparent);background:color-mix(in srgb,var(--surfVar) 50%,transparent);font:600 10px 'Fredoka';color:var(--ink2)}
.ncf.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.sw{width:44px;height:26px;border-radius:99px;border:0;background:var(--border);position:relative;flex:none;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--primary)}.sw.on::after{transform:translateX(18px)}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.modal{position:absolute;inset:0;z-index:70;background:rgba(2,6,23,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;animation:pop .2s ease-out}
.bio{width:100%;max-width:370px;border-radius:26px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);box-shadow:0 24px 60px rgba(0,0,0,.4)}
.sensor{width:110px;height:110px;border-radius:50%;border:0;background:none;display:flex;align-items:center;justify-content:center;position:relative;padding:0;color:var(--acc)}
.sensor .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);opacity:.55;animation:ring 1.1s ease-in-out infinite alternate}
.sensor.scan .ring{opacity:.95}
@keyframes ring{from{transform:scale(.92)}to{transform:scale(1.18)}}
.sensor .core{width:82px;height:82px;border-radius:50%;background:#F8FAFC;border:1.5px solid color-mix(in srgb,var(--acc) 45%,transparent);display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden}
:root.dark .sensor .core{background:#131C2E}
.sensor .laser{position:absolute;left:12%;right:12%;height:2px;border-radius:2px;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:laser .9s linear infinite alternate}
@keyframes laser{from{top:15%}to{top:85%}}
.tile{flex:1;display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:14px;border:1px solid var(--border);background:color-mix(in srgb,var(--surfVar) 55%,transparent)}
.tile b{display:block;font:700 13.5px 'Fredoka';white-space:nowrap}.tile small{display:block;font-size:10px;font-weight:700;color:var(--ink2);white-space:nowrap}
.celeb{position:absolute;inset:0;z-index:90;background:linear-gradient(180deg,#059669,#10B981,#047857);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .26s;animation:cflash .28s ease-out}
@keyframes cflash{from{box-shadow:inset 0 0 0 2000px #fff}to{box-shadow:inset 0 0 0 2000px rgba(255,255,255,0)}}
.conf{position:absolute;left:50%;top:34%}
.conf i{position:absolute;width:10px;height:6px;border-radius:2px;margin:-3px -5px;animation:conf 2.4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes conf{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),calc(var(--dy) + 42vh)) rotate(var(--r));opacity:0}}
.cring{position:absolute;border-radius:50%;background:#fff;animation:breath 1.2s ease-in-out infinite alternate}
.ccirc{width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.22);border:3.5px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 50px rgba(0,0,0,.25);animation:cpop .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes cpop{from{transform:scale(0)}to{transform:scale(1)}}
.cchk{stroke-dasharray:1;stroke-dashoffset:1;animation:cdraw .52s .4s ease-out forwards}
@keyframes cdraw{to{stroke-dashoffset:0}}
.cfade{opacity:0;animation:cfade .36s .92s forwards}@keyframes cfade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------------- daily offers (same algorithm as the app) ---------------- */
function dailyOffers(){
  const now=new Date(),start=new Date(now.getFullYear(),0,0),doy=Math.floor((now-start)/864e5)+S.offerDay;
  const dow=((now.getDay()+S.offerDay)%7+7)%7;
  const names=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const themes=isArca()?["Domingo de Snacks & Premios","Lunes de Aves & Exóticos","Martes de Alimentos Secos","Miércoles de Húmedos & Snacks","Jueves de Salud Veterinaria","Viernes de Arena & Higiene","Sábado de Mascotas & Hogar"]:["Domingo Familiar & Embutidos","Lunes de Frutas & Vegetales","Martes de Carnes & Mariscos","Miércoles de Despensa & Bebidas","Jueves de Lácteos & Panadería","Viernes de Limpieza & Hogar","Sábado de Hogar & Cuidado Personal"];
  const allowed=isArca()?[["Alimentos Húmedos y Snacks","Juguetes y Confort"],["Aves, Peces y Exóticos"],["Alimentos Secos"],["Alimentos Húmedos y Snacks"],["Salud y Cuidado Veterinario","Farmacia y Suplementos"],["Hogar y Arena Sanitaria"],["Hogar y Arena Sanitaria","Accesorios y Paseo","Juguetes y Confort"]][dow]
    :[["Embutidos","Panes y galletas","Snacks y dulces"],["Frutas y vegetales"],["Carne res y cerdo","Pescadería y mariscos"],["Alimentación general","Aceite y vinagres","Agua y refrescos"],["Lácteos y huevos","Panes y galletas"],["Hogar y limpieza"],["Hogar y limpieza","Cuidado personal","Bebés"]][dow];
  const pool=storeProducts();let dayPool=pool.filter(p=>allowed.includes(p.cat));if(!dayPool.length)dayPool=pool;
  const steps=[20,25,18,30,22],base=(doy*3)%dayPool.length;
  const label=S.offerDay===0?`Hoy ${names[dow]}`:`${names[dow]} (+${S.offerDay}d)`;
  return {label,theme:themes[dow],offers:Array.from({length:Math.min(5,dayPool.length)},(_,i)=>{const p=dayPool[(base+i)%dayPool.length],pct=steps[(doy+i)%5];return{p,pct,orig:Math.max(Math.floor(p.price*100/(100-pct)),p.price+25),label}})};
}
window.rotateDay=()=>{S.offerDay=(S.offerDay+1)%7;const d=dailyOffers(),t=d.offers[0];if(t)toast('offer',`${t.label}: ${t.p.name} (-${t.pct}%)`);if(S.screen==='catalog')renderCatalog(true);else renderHome(true)};
window.offerPush=()=>{const d=dailyOffers(),t=d.offers[0];toast('bell',t?`Push enviado: ${t.p.name} -${t.pct}%`:'Push enviado')};

  const live=Math.min(48,Math.max(14,(seg.sp>0?seg.sp:26)+Math.trunc(Math.sin(tick*.08))*2));

window.driverSend=async t=>{const i=$('dIn'),msg=(t||(i&&i.value)||'').trim();if(!msg||DTYPING)return;
  DCHAT.push({s:'user',t:msg,ts:tnow(),sp:TEL.speed});DTYPING=true;renderDelivery(true);
  const o=trackedOrder(),oid=o?o.id:'ORD-88412',f=(S.profile?.name||'Cliente').split(' ')[0]||'Cliente';
  const items=o?o.skus.map(s=>BY_SKU[s]?.name).filter(Boolean).slice(0,5).join(', '):'productos frescos de Supermercados Bravo';
  const prompt=`Actúa como Carlos Rodríguez, repartidor motorista Express de Supermercados Bravo en Santo Domingo (Placa K-04921, calificación 4.95 estrellas).\nEstás entregando en tiempo real el pedido #${oid} al cliente ${f}.\nDatos reales del GPS en este instante:\n- Calle actual: ${TEL.street}\n- Velocidad actual: ${TEL.speed} km/h\n- Estado del tráfico: ${TEL.tc} (${TEL.tl})\n- Distancia restante: ${TEL.rem} km\n- Tiempo estimado de llegada (ETA): ${TEL.eta} minutos\n- Artículos en la mochila térmica: ${items}\nEl cliente te acaba de escribir este mensaje: "${msg}"\nResponde en primera persona como Carlos Rodríguez, en 1 o 2 oraciones breves, amables, profesionales y realistas, mencionando tu calle o velocidad/ETA actual si aplica. No uses códigos SKU.`;
  let reply='';
  try{if(!window.BV_FB)throw 0;await Promise.race([(async()=>{for await(const c of BV_FB.generate(prompt))reply+=c})(),new Promise((_,r)=>setTimeout(()=>r('timeout'),8500))]);reply=reply.trim();if(reply.length<12)throw 0}
  catch(e){await new Promise(r=>setTimeout(r,650));reply=driverReply(msg,oid)}
  reply=reply.replace(/\b[A-Z]{3}-\d+\b/g,'');DCHAT.push({s:'driver',t:reply,ts:tnow(),sp:TEL.speed});DTYPING=false;
  BANNER={icon:'delivery',title:`Mensaje de Carlos Rodríguez (${TEL.speed} km/h)`,sub:reply.replace(/\*\*/g,''),speed:TEL.speed,eta:TEL.eta,pct:Math.round(TEL.frac*100)};
  if(S.screen==='delivery')renderDelivery(true)};
/* ---------- Mapa (RealInteractiveDeliveryMapView, dibujado igual en canvas) ---------- */
const MAP={zoom:1,az:1,px:0,py:0,follow:true,dash:36,raf:0,ax:null,ay:null,
  btn(){const l=$('followLbl');if(l)l.textContent=this.follow?'Siguiendo':'Centrar'},
  mount(){const host=$('dmap'),cv=$('dmapc');if(!host)return;cancelAnimationFrame(this.raf);
    let drag=null;host.onpointerdown=e=>{drag=[e.clientX,e.clientY];host.setPointerCapture(e.pointerId)};
    host.onpointermove=e=>{if(!drag)return;this.follow=false;this.px=Math.max(-180,Math.min(180,this.px+(e.clientX-drag[0])));this.py=Math.max(-140,Math.min(140,this.py+(e.clientY-drag[1])));drag=[e.clientX,e.clientY];this.btn()};
    host.onpointerup=()=>drag=null;
    let t0=performance.now();const loop=t=>{if(!document.body.contains(cv))return;this.draw(cv,(t-t0)/1000);this.raf=requestAnimationFrame(loop)};this.raf=requestAnimationFrame(loop)},
  draw(cv,sec){const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr}
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);const d=S.dark,s=dpr>1?1:1;
    this.az+=(this.zoom-this.az)*.2;
    const segs=ROUTE.length-1,sp=Math.min(1,Math.max(0,TEL.frac))*segs,lo=Math.min(segs,Math.floor(sp)),hi=Math.min(segs,lo+1),f=sp-lo;
    const tx=ROUTE[lo][0]+(ROUTE[hi][0]-ROUTE[lo][0])*f,ty=ROUTE[lo][1]+(ROUTE[hi][1]-ROUTE[lo][1])*f;
    if(this.ax==null){this.ax=tx;this.ay=ty}this.ax+=(tx-this.ax)*.25;this.ay+=(ty-this.ay)*.25;
    const fx=this.follow&&this.zoom>1.05?(.5-this.ax)*W*.45:this.px,fy=this.follow&&this.zoom>1.05?(.5-this.ay)*H*.45:this.py,z=this.az;
    const P=(x,y)=>[W/2+(W*x-W/2)*z+fx,H/2+(H*y-H/2)*z+fy];
    const C=d?{bg:'#0C1320',bl:'#131C2E',pk:'#102A22',wt:'#0E2238',ss:'#1E293B',av:'#283548',bd:'#334155'}:{bg:'#E9EEF5',bl:'#F4F7FB',pk:'#D6EFE0',wt:'#CFE6FA',ss:'#FFFFFF',av:'#FFFBEB',bd:'#CBD5E1'};
    g.fillStyle=C.bg;g.fillRect(0,0,W,H);
    const rr=(a,b,c,e,col,r)=>{const p1=P(a,b),p2=P(c,e);g.fillStyle=col;g.beginPath();g.roundRect(p1[0],p1[1],Math.max(4,p2[0]-p1[0]),Math.max(4,p2[1]-p1[1]),r*z/2.6);g.fill()};
    [[.04,.06,.18,.19],[.26,.05,.45,.19],[.51,.05,.64,.19],[.04,.27,.18,.43],[.26,.27,.45,.43],[.51,.27,.64,.43],[.72,.36,.94,.44],[.35,.54,.64,.70],[.72,.54,.95,.70],[.35,.78,.64,.94]].forEach(b=>rr(...b,C.bl,12));
    rr(.05,.55,.29,.89,C.pk,18);rr(.71,.07,.94,.30,C.pk,18);rr(.09,.64,.21,.78,C.wt,24);
    const line=(a,b,c,e,col,w)=>{const p1=P(a,b),p2=P(c,e);g.strokeStyle=col;g.lineWidth=w*z/2.6;g.lineCap='round';g.beginPath();g.moveTo(...p1);g.lineTo(...p2);g.stroke()};
    [[0,.22,1,.22],[0,.74,1,.74],[.48,0,.48,1],[.32,0,.32,1],[.84,0,.84,1],[.18,.22,.84,.76]].forEach(l=>{line(...l,C.bd,13);line(...l,C.ss,10)});
    [[.21,0,.21,1],[.68,0,.68,1],[0,.48,1,.48]].forEach(l=>{line(...l,C.bd,22);line(...l,C.av,18)});
    g.font=`800 ${Math.max(9,Math.min(15,10.5*z))}px Nunito,sans-serif`;g.fillStyle=d?'rgba(203,213,225,.84)':'rgba(51,65,85,.86)';
    [['Av. 27 de Febrero',.35,.465],['C. Roberto Pastoriza',.24,.205],['Av. Gustavo Mejía Ricart',.36,.725],['Av. Churchill',.03,.38],['Av. Lincoln',.70,.62]].forEach(([t,x,y])=>g.fillText(t,...P(x,y)));
    g.font=`800 ${Math.max(8.5,Math.min(13,9.5*z))}px Nunito,sans-serif`;g.fillStyle=d?'rgba(110,231,183,.82)':'rgba(4,120,87,.86)';
    g.fillText('Parque La Lira',...P(.07,.61));g.fillText('Plaza Piantini',...P(.73,.16));
    const prim=getComputedStyle(document.documentElement).getPropertyValue('--primary').trim()||'#D9232A';
    const rc=TEL.tl==='DENSO'?'#F59E0B':TEL.tl==='MODERADO'?'#10B981':'#059669';
    const path=()=>{g.beginPath();ROUTE.forEach((p,i)=>{const q=P(...p);i?g.lineTo(...q):g.moveTo(...q)})};
    g.lineJoin='round';g.lineCap='round';
    path();g.strokeStyle=hexA(prim,.24);g.lineWidth=18*z/2.6;g.setLineDash([]);g.stroke();
    path();g.strokeStyle=hexA(rc,.35);g.lineWidth=9*z/2.6;g.stroke();
    path();g.strokeStyle=rc;g.lineWidth=6.5*z/2.6;g.setLineDash([20/2.6,14/2.6]);g.lineDashOffset=-((sec*34/0.95)%34)/2.6;g.stroke();g.setLineDash([]);
    const dot=(p,r1,r2,r3,c)=>{g.fillStyle=hexA(c,.25);g.beginPath();g.arc(...p,r1*z/2.6,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(...p,r2*z/2.6,0,7);g.fill();g.fillStyle=c;g.beginPath();g.arc(...p,r3*z/2.6,0,7);g.fill()};
    const o=P(...ROUTE[0]),de=P(...ROUTE[8]),dr=P(this.ax,this.ay);
    dot(o,18,11,8,prim);dot(de,20,12,8.5,'#059669');
    g.strokeStyle=prim;g.lineWidth=6*z/2.6;g.beginPath();g.moveTo(...o);g.lineTo(...dr);g.stroke();
    const pr=12+((sec%1.1)/1.1)*16;g.fillStyle=hexA(prim,.28);g.beginPath();g.arc(...dr,pr*z/2.6*1.3,0,7);g.fill();
    dot(dr,0,14,10.5,prim);
    const tag=(p,t,bg,fg)=>{g.font='800 10px Nunito,sans-serif';const w=g.measureText(t).width+14;g.fillStyle=bg;g.beginPath();g.roundRect(p[0]-w/2,p[1]-30,w,20,10);g.fill();g.fillStyle=fg;g.fillText(t,p[0]-w/2+7,p[1]-16)};
    tag(o,`🏪 ${S.branch}`,d?'rgba(17,24,39,.9)':'rgba(255,255,255,.95)',d?'#F8FAFC':'#0F172A');tag(de,'📍 Tu Entrega','#059669','#fff');tag(dr,`🛵 Carlos • ${TEL.speed} km/h`,prim,'#fff');
  }};
window.mapZoom=d=>{MAP.zoom=Math.max(.85,Math.min(2.25,MAP.zoom+d))};
/* ---------- Celebración (OrderSuccessCelebrationOverlay) ---------- */
function celebration(){const c=S.celebrate,cols=['#D9232A','#F59E0B','#10B981','#FFFFFF'];
  const conf=Array.from({length:24},(_,i)=>{const a=((i*137.5)%360)*Math.PI/180,sp=.35+((i*29)%100)/150;return `<i style="--dx:${Math.cos(a)*72*sp}vw;--dy:${Math.sin(a)*72*sp*.68}vw;--r:${540+i*24}deg;background:${cols[i%4]}"></i>`}).join('');
  return `<div class="celeb" onclick="endCelebrate()" role="dialog" aria-label="Pedido confirmado"><div class="conf">${conf}</div><span class="cring" style="width:250px;height:250px;opacity:.16"></span><span class="cring" style="width:188px;height:188px;opacity:.22"></span>
   <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 28px;text-align:center">
    <div class="ccirc"><svg viewBox="0 0 68 68" width="68" height="68"><path d="M12 35.4 29.2 51.7 57.1 17.7" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="cchk"/></svg></div>
    <div class="cfade" style="display:flex;flex-direction:column;align-items:center;gap:8px"><div class="disp" style="font-weight:700;font-size:28px;color:#fff">¡Pedido Confirmado!</div>
     <div style="font-weight:800;font-size:16px;color:rgba(255,255,255,.92)">Orden ${esc(c.id)} • RD$${fmt(c.total)}</div>
     <div class="row" style="gap:10px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;text-align:left">${ic('locate','font-size:22px')}<div><div style="font-weight:800;font-size:13px">${esc(c.branch)} • ${c.km} km</div><div style="font-size:11.5px;font-weight:700;opacity:.9">Llegada estimada por GPS: ~${c.eta} min</div></div></div></div></div></div>`}
window.endCelebrate=()=>{if(!S.celebrate)return;S.celebrate=null;const el=document.querySelector('.celeb');if(el){el.style.opacity=0;setTimeout(()=>el.remove(),260)}};
/* ---------------- dock + router ---------------- */
const TABS=[['bravisima','card','Tarjeta'],['catalog','grid','Catálogos'],['home','home','Home'],['bravia','search','Buscar'],['account','person','Perfil']];
function activeTab(){return {bravisima:'bravisima',catalog:'catalog',category:'catalog',product:'catalog',home:'home',cart:'home',delivery:'home',bravia:'bravia',account:'account',account_sub:'account'}[S.screen]}
function renderDock(){const a=activeTab();$('dock').innerHTML=TABS.map(([k,i,l])=>`<button class="dk ${a===k?'on':''}" aria-label="${l}" ${a===k?'aria-current="page"':''} onclick="go('${k}')">${ic(i)}${k==='bravia'?`<span class="spark">${ic('spark')}</span>`:''}</button>`).join('')}
const TITLES={bravisima:['Tarjeta Bravísima','Tarjeta, cashback y canjes: ronda 3.'],account:['Mi cuenta','Pedidos, perfil, pagos, direcciones, listas y ajustes: ronda 3.']};
window.go=(s,noPush)=>{if(!noPush&&S.screen!==s&&!['splash','auth'].includes(S.screen)){HIST.push(S.screen);if(HIST.length>40)HIST.shift()}if(s==='category'&&S.screen!=='category')S.gridQ='';S.bio=null;S.screen=s;S.storeMenu=false;applyTheme();render()};
function render(){
  const s=S.screen;
  const inApp=!['splash','auth'].includes(s);
  $('dock').classList.toggle('hide',!inApp);$('fabs').classList.toggle('hide',!(inApp&&['home','catalog','category'].includes(s)));
  if(inApp)renderDock();
  if(s==='splash')renderSplash();else if(s==='auth')renderAuth();else if(s==='home')renderHome();else if(s==='bravia')renderBravIA();else if(s==='catalog')renderCatalog();else if(s==='category')renderCategory();else if(s==='product')renderProduct();else if(s==='cart')renderCart();else if(s==='delivery')renderDelivery();else renderPlaceholder(...TITLES[s]);
  updateCart();
}
$('icAi').innerHTML=ic('spark');$('icCart').innerHTML=ic('cart');
applyTheme();render();
fetch('products.json').then(r=>r.json()).then(rows=>{
  PRODUCTS=rows.map(r=>({sku:r[0],name:r[1],price:r[2],cat:r[3],unit:r[4],bravo:!!r[5],art:r[6],color:r[7],badge:r[8],img:r[9],store:r[10]}));
  PRODUCTS.forEach(p=>BY_SKU[p.sku]=p);
}).catch(()=>{}).finally(()=>setTimeout(()=>{$('screen').style.opacity=0;setTimeout(()=>{$('screen').style.opacity='';go(S.authed?'home':'auth')},350)},1600));
}
