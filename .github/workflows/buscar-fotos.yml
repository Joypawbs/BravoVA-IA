name: Buscar fotos para productos sin foto
on: workflow_dispatch
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Buscar candidatas y armar hojas
        run: |
          # Consultas escritas a mano por producto (marca + término genérico en inglés)
          python3 -u .github/scripts/fotos_faltantes.py out .github/fotos/consultas.tsv
      - name: Publicar en la rama fotos-candidatas
        run: |
          cd out && git init -q -b fotos-candidatas
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Fotos candidatas"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fotos-candidatas
