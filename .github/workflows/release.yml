name: Publicar versión

# Al subir una etiqueta vX.Y.Z se compilan las apps y se crea el release con:
#   - BravoVa-vX.Y.Z-android-release.apk  (firmada con la clave de lanzamiento)
#   - BravoVa-vX.Y.Z-android-debug.apk    (versión de prueba)
#   - BravoVa-vX.Y.Z-ios-sin-firmar.ipa   (para instalar con AltStore o Sideloadly)
# Desde la 3.2 la app de iOS es Swift nativo (bravova-ios/); Android sigue en Kotlin (bravova/).
# Las notas salen de .github/release-notes/vX.Y.Z.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a publicar (por ejemplo v1.1.0)"
        required: true
      ref:
        description: "Commit o rama que se compila (vacío = la etiqueta)"
        required: false

permissions:
  contents: write

env:
  # Clave de Google Maps (opcional): sin ella el seguimiento usa el mapa ilustrado
  MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
  # Clave de Gemini (Google AI Studio) para Brav IA (opcional): sin ella usa Firebase AI Logic
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Qué se compila: el commit indicado, o la propia etiqueta si ya existe
  SRC: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bravova
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC }}
      - name: Commits anteriores al cambio de nombre (ios/ -> bravova/)
        working-directory: .
        run: if [ -d ios ] && [ ! -d bravova ]; then mv ios bravova; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Versión a partir de la etiqueta
        run: |
          V="${TAG#v}"; BASE="${V%%-*}"; IFS=. read -r MA MI PA <<< "$BASE"
          CODE=$((MA*10000 + MI*100 + ${PA:-0}))
          # Beta (v2.0.0-beta1): queda por debajo de la versión final, pero por encima de la anterior
          if [[ "$V" == *-beta* ]]; then N="${V##*beta}"; CODE=$((CODE - 100 + ${N:-1})); fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bravova-release.jks"
            echo "BRAVOVA_KEYSTORE_FILE=$RUNNER_TEMP/bravova-release.jks" >> "$GITHUB_ENV"
            echo "BRAVOVA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Faltan los secretos ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD: solo se publicará la APK de prueba."
          fi
      - name: Compilar APKs
        run: |
          ./gradlew --no-daemon -PappVersionCode=$VERSION_CODE -PappVersionName=$VERSION_NAME :composeApp:assembleDebug
          mkdir -p ../dist
          cp "$(ls composeApp/build/outputs/apk/debug/*.apk | head -1)" "../dist/BravoVa-$TAG-android-debug.apk"
          if [ -n "${BRAVOVA_KEYSTORE_FILE:-}" ]; then
            ./gradlew --no-daemon -PappVersionCode=$VERSION_CODE -PappVersionName=$VERSION_NAME :composeApp:assembleRelease
            cp "$(ls composeApp/build/outputs/apk/release/*.apk | head -1)" "../dist/BravoVa-$TAG-android-release.apk"
          fi
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  ios:
    # Xcode 27 + SDK de iOS 27 (imagen de GitHub con Xcode 27 sobre macOS 27, Apple Silicon)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC }}
      - name: Commits anteriores al cambio de nombre (ios/ -> bravova/)
        working-directory: .
        run: if [ -d ios ] && [ ! -d bravova ]; then mv ios bravova; fi
      - uses: actions/setup-java@v4
        if: hashFiles('bravova-ios/project.yml') == ''
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: hashFiles('bravova-ios/project.yml') == ''
      - name: Xcode 27
        run: |
          # La imagen xcode-27 trae Xcode 27 como predeterminado
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Brav IA debe funcionar antes de publicar (sin mostrar la clave)
        if: hashFiles('bravova-ios/project.yml') != ''
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::Falta el secreto GEMINI_API_KEY"; exit 1; }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1")
          echo "Gemini respondió HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::La clave de Gemini no es válida: no se publica"; exit 1; }
      - name: Compilar IPA sin firmar (Swift nativo)
        if: hashFiles('bravova-ios/project.yml') != ''
        working-directory: bravova-ios
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          perl -0pi -e 's/(isa = PBXFileReference;)[^}]*?(path = AppIcon\.icon;)/$1 lastKnownFileType = folder.iconcomposer.icon; $2/g' BravoVa.xcodeproj/project.pbxproj
          V="${TAG#v}"; BASE="${V%%-*}"; IFS=. read -r MA MI PA <<< "$BASE"
          CODE=$((MA*10000 + MI*100 + ${PA:-0}))
          if [[ "$V" == *-beta* ]]; then N="${V##*beta}"; CODE=$((CODE - 100 + ${N:-1})); fi
          # La clave llega por la variable de entorno (no en la línea de comandos, que se imprime)
          xcodebuild -project BravoVa.xcodeproj -scheme BravoVa -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            MARKETING_VERSION="$BASE" CURRENT_PROJECT_VERSION="$CODE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 \
            || { grep -E "error:" build.log | sed 's|.*/bravova-ios/||' | sort -u | head -60; exit 1; }
          APP=$(find build/device/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          LEN=$(/usr/libexec/PlistBuddy -c "Print :BravIAGeminiKey" "$APP/Info.plist" 2>/dev/null | tr -d '\n' | wc -c | tr -d ' ')
          [ "$LEN" -gt 20 ] || { echo "::error::La app no lleva la clave de Gemini"; exit 1; }
          # El catálogo empaquetado debe estar completo y ser JSON válido
          python3 - "$APP" <<'PY'
          import json, sys, os
          app = sys.argv[1]
          c = json.load(open(os.path.join(app, "catalogo.json"), encoding="utf-8"))
          b, a = len(c["bravoProducts"]), len(c["arcaProducts"])
          f = os.path.join(app, "fotos.json")
          if os.path.exists(f): json.load(open(f, encoding="utf-8"))
          print(f"Catálogo en la app: bravo={b} arca={a}")
          sys.exit(0 if b >= 500 and a >= 250 else 1)
          PY
          mkdir -p Payload && cp -R "$APP" Payload/
          mkdir -p ../dist && zip -qry "../dist/BravoVa-$TAG-ios-sin-firmar.ipa" Payload
      - name: Compilar IPA sin firmar (versiones anteriores, Kotlin)
        if: hashFiles('bravova-ios/project.yml') == ''
        working-directory: bravova/iosApp
        run: |
          set -o pipefail
          brew install xcodegen
          # Commits anteriores a scripts/generar_proyecto.sh generan el proyecto directo
          if [ -f ../scripts/generar_proyecto.sh ]; then bash ../scripts/generar_proyecto.sh; else xcodegen generate; fi
          V="${TAG#v}"; BASE="${V%%-*}"; IFS=. read -r MA MI PA <<< "$BASE"
          CODE=$((MA*10000 + MI*100 + ${PA:-0}))
          # Beta (v2.0.0-beta1): queda por debajo de la versión final, pero por encima de la anterior
          if [[ "$V" == *-beta* ]]; then N="${V##*beta}"; CODE=$((CODE - 100 + ${N:-1})); fi
          # iOS solo acepta números en la versión visible: 2.0.0 (la beta se distingue por el número de compilación)
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            MARKETING_VERSION="$BASE" CURRENT_PROJECT_VERSION="$CODE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 80
          APP=$(find build/device/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          mkdir -p ../../dist && zip -qry "../../dist/BravoVa-$TAG-ios-sin-firmar.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  publicar:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Las notas se leen de la rama principal; el código publicado es el de SRC
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/$TAG.md"
          [ -f "$NOTES" ] || { echo "BravoVa $TAG" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          TARGET=$(git rev-parse "$SRC^{commit}" 2>/dev/null || git rev-parse "origin/$SRC")
          # Crea la etiqueta (si no existe) apuntando al commit publicado
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET" -m "BravoVa $TAG"
            git push origin "refs/tags/$TAG"
          fi
          gh release delete "$TAG" -y 2>/dev/null || true
          # Las etiquetas con guion (v2.0.0-beta1) se publican como versión de prueba
          PRE=""; [[ "$TAG" == *-* ]] && PRE="--prerelease"
          gh release create "$TAG" dist/* --title "BravoVa $TAG" --notes-file "$NOTES" --verify-tag $PRE
