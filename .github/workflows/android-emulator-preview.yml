name: Vista en emulador Android

on:
  workflow_dispatch:
    inputs:
      minify:
        description: "Compilar con R8 (true/false), para medir el antes y el después"
        required: false
        default: "true"

permissions:
  contents: write

env:
  # Clave de Google Maps (opcional): sin ella el seguimiento usa el mapa ilustrado
  MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK profile (como la de lanzamiento, firmada con clave de depuración)
        run: ./gradlew --no-daemon -Pminify=${{ github.event.inputs.minify || 'true' }} :composeApp:assembleProfile
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Recorrido en el emulador (Pixel, Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -camera-back none
          working-directory: ios
          script: |
            adb install -r $(ls composeApp/build/outputs/apk/profile/*.apk | head -1)
            python3 ../.github/scripts/android_tour.py ../android-out
      - name: Publicar capturas en la rama capturas-android
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/pub && cp android-out/* /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q -b capturas-android
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Capturas del emulador Android\n\nGeneradas por "Vista en emulador Android" (%s).\n' "$(date -u)" > README.md
          for f in *.png; do printf '\n### %s\n![%s](%s)\n' "$f" "$f" "$f" >> README.md; done
          git add -A && git commit -qm "Capturas del emulador Android"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas-android
