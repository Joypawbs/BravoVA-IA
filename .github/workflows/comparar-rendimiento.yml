# Compara la fluidez de dos versiones en el MISMO emulador y la misma corrida (A, B, A, B),
# para que la variación entre máquinas de GitHub no influya en el resultado.
# A = antes (commit "antes", sin R8), B = ahora (rama main, con R8).
name: Comparar rendimiento

on:
  workflow_dispatch:
    inputs:
      antes:
        description: "Commit de la versión de antes"
        required: true
        default: "05b5bd9"

permissions:
  contents: write

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar B (ahora, con R8)
        working-directory: bravova
        run: |
          ./gradlew --no-daemon -Pminify=true :composeApp:assembleProfile
          cp "$(ls composeApp/build/outputs/apk/profile/*.apk | head -1)" /tmp/B.apk
      - name: Compilar A (antes, sin R8)
        run: |
          cp .github/scripts/android_perf.py /tmp/android_perf.py
          git checkout -q "${{ github.event.inputs.antes }}"
          # Antes del cambio de nombre la carpeta se llamaba ios/
          if [ -f ios/settings.gradle.kts ]; then cd ios; else cd bravova; fi
          ./gradlew --no-daemon -Pminify=false :composeApp:assembleProfile
          cp "$(ls composeApp/build/outputs/apk/profile/*.apk | head -1)" /tmp/A.apk
          ls -la /tmp/A.apk /tmp/B.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Medir A, B, A, B en el mismo emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p /tmp/out
            echo "Tamaño de la APK: A=$(stat -c%s /tmp/A.apk) bytes, B=$(stat -c%s /tmp/B.apk) bytes" > /tmp/out/comparacion.txt
            for r in 1 2; do for v in A B; do adb uninstall com.aistudio.bravova.rdshop >/dev/null 2>&1 || true; adb install -r /tmp/$v.apk; python3 /tmp/android_perf.py "$v ronda $r" /tmp/out/comparacion.txt; done; done
      - name: Publicar en la rama rendimiento
        if: always()
        run: |
          cd /tmp/out && cat comparacion.txt
          git init -q -b rendimiento
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Comparación de rendimiento"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rendimiento
