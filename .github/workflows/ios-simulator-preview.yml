name: Vista en simulador iOS

# Compila la app de bravova/, la abre en un iPhone simulado y guarda capturas y un video.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Imagen de macOS (xcode-27, macos-latest o macos-15)"
        default: xcode-27
      solo:
        description: "Solo esta prueba (por ejemplo iosAppUITests/BravoVaTourUITests/testVidrioBravIa); vacío = todas"
        default: ""

permissions:
  contents: write

jobs:
  simulator:
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    # El recorrido completo dura ~60 min en un Mac rápido; los lentos tardan ~1,7×
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        run: |
          # En la imagen xcode-27 se usa su Xcode 27; en otras, el Xcode 26 más nuevo
          if ! xcodebuild -version | grep -q "Xcode 27"; then
            X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
            [ -n "$X" ] && sudo xcode-select -s "$X"
          fi
          xcodebuild -version
      - name: Build Kotlin framework (simulator)
        working-directory: bravova
        run: ./gradlew --no-daemon :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: bravova/iosApp
        run: bash ../scripts/generar_proyecto.sh
      - name: Boot iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k in sorted(d,reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith(('iPhone 18 Pro','iPhone 17 Pro','iPhone 16 Pro')) and 'Max' not in x['name']] or [x for k in sorted(d,reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')];print(c[0]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
      - name: Recorrido automático (XCUITest)
        working-directory: bravova/iosApp
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sim-out"
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$GITHUB_WORKSPACE/sim-out/recorrido.mp4" &
          echo $! > /tmp/rec.pid
          set -o pipefail
          TEST_RUNNER_SHOTS_DIR="$GITHUB_WORKSPACE/sim-out" xcodebuild test -project iosApp.xcodeproj -scheme iosApp \
            -destination "id=$UDID" -derivedDataPath build/test \
            -resultBundlePath "$GITHUB_WORKSPACE/sim-out/resultado.xcresult" \
            ${{ inputs.solo && format('-only-testing:{0}', inputs.solo) || '' }} \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO ARCHS=arm64 2>&1 | grep -E "\[tour\]|error:|Test Case|passed|failed|\*\* TEST" | tail -n 80 || true
          kill -INT $(cat /tmp/rec.pid) || true; sleep 3
          ls -la "$GITHUB_WORKSPACE/sim-out"
      - name: Registro del sistema y reportes de cierre
        if: always()
        run: |
          mkdir -p sim-out
          # La app se llama BravoVa (PRODUCT_NAME): errores, fallos y excepciones de Kotlin
          xcrun simctl spawn booted log show --last 90m --style compact \
            --predicate '(process == "BravoVa" AND (messageType == error OR messageType == fault)) OR eventMessage CONTAINS "BRAVO_CRASH" OR eventMessage CONTAINS "Terminating app"' \
            > sim-out/registro_app.txt 2>&1 || true
          tail -c 300000 sim-out/registro_app.txt > sim-out/registro_app.log || true
          grep -B2 -A80 "BRAVO_CRASH\|Terminating app\|uncaught\|Fatal error" sim-out/registro_app.txt | head -400 > sim-out/crash_kotlin.txt || true
          # Reportes de cierre (.ips) recientes del Mac anfitrión del simulador
          find ~/Library/Logs/DiagnosticReports -name "*.ips" -mmin -120 2>/dev/null | while read f; do
            echo "== $f"; head -c 120000 "$f" > "sim-out/reporte_$(basename "$f" .ips).txt"
          done
          ls -la sim-out | tail -20
      - name: Exportar capturas del resultado
        if: always()
        run: |
          cd sim-out
          if ! ls [0-9][0-9]_*.png >/dev/null 2>&1 && [ -d resultado.xcresult ]; then
            xcrun xcresulttool export attachments --path resultado.xcresult --output-path adjuntos || true
            i=0; for f in adjuntos/*.png; do [ -f "$f" ] || continue; i=$((i+1)); cp "$f" "$(printf '%02d' $i)_$(basename "$f")"; done
          fi
          ls -la
      - name: Publicar capturas en la rama capturas-simulador
        if: always()
        run: |
          mkdir -p /tmp/pub && cp sim-out/*.png sim-out/*.log sim-out/*.txt /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q -b capturas-simulador
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Capturas del simulador iOS\n\nGeneradas por el flujo "Vista en simulador iOS" (%s).\n' "$(date -u)" > README.md
          for f in *.png; do printf '\n### %s\n![%s](%s)\n' "$f" "$f" "$f" >> README.md; done
          git add -A && git commit -qm "Capturas del simulador iOS"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas-simulador
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BravoVa-simulador-ios
          path: sim-out
