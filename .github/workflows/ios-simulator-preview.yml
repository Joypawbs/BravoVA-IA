name: Vista en simulador iOS

# Compila la app de ios/, la abre en un iPhone simulado y guarda capturas y un video.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Imagen de macOS (macos-latest o macos-15)"
        default: macos-latest

permissions:
  contents: write

jobs:
  simulator:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.2.app || true; xcodebuild -version
      - name: Build Kotlin framework (simulator)
        working-directory: ios
        run: ./gradlew --no-daemon :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Install XcodeGen and idb
        run: |
          brew install xcodegen
          # idb permite tocar la pantalla del simulador; si no se instala, solo habrá capturas del arranque
          brew tap facebook/fb || true
          brew trust facebook/fb 2>/dev/null || true
          X26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X26" ]; then export DEVELOPER_DIR="$X26/Contents/Developer"; echo "idb-companion con $X26"; fi
          HOMEBREW_NO_INSTALL_FROM_API=1 brew install facebook/fb/idb-companion \
            || brew install --formula facebook/fb/idb-companion \
            || echo "::warning::idb-companion no se pudo instalar"
          python3 -m pip install --break-system-packages fb-idb || pipx install fb-idb || true
          which idb idb_companion || true
      - name: Generate Xcode project
        working-directory: ios/iosApp
        run: xcodegen generate
      - name: Boot iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k in sorted(d,reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone 16 Pro') and 'Max' not in x['name']] or [x for k in sorted(d,reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')];print(c[0]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
      - name: Recorrido automático (XCUITest)
        working-directory: ios/iosApp
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sim-out"
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$GITHUB_WORKSPACE/sim-out/recorrido.mp4" &
          echo $! > /tmp/rec.pid
          set -o pipefail
          TEST_RUNNER_SHOTS_DIR="$GITHUB_WORKSPACE/sim-out" xcodebuild test -project iosApp.xcodeproj -scheme iosApp \
            -destination "id=$UDID" -derivedDataPath build/test \
            -resultBundlePath "$GITHUB_WORKSPACE/sim-out/resultado.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO ARCHS=arm64 2>&1 | grep -E "\[tour\]|error:|Test Case|passed|failed|\*\* TEST" | tail -n 80 || true
          kill -INT $(cat /tmp/rec.pid) || true; sleep 3
          ls -la "$GITHUB_WORKSPACE/sim-out"
      - name: Exportar capturas del resultado
        if: always()
        run: |
          cd sim-out
          if ! ls [0-9][0-9]_*.png >/dev/null 2>&1 && [ -d resultado.xcresult ]; then
            xcrun xcresulttool export attachments --path resultado.xcresult --output-path adjuntos || true
            i=0; for f in adjuntos/*.png; do [ -f "$f" ] || continue; i=$((i+1)); cp "$f" "$(printf '%02d' $i)_$(basename "$f")"; done
          fi
          ls -la
      - name: Publicar capturas en la rama capturas-simulador
        if: always()
        run: |
          mkdir -p /tmp/pub && cp sim-out/*.png sim-out/*.log sim-out/*.txt /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q -b capturas-simulador
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Capturas del simulador iOS\n\nGeneradas por el flujo "Vista en simulador iOS" (%s).\n' "$(date -u)" > README.md
          for f in *.png; do printf '\n### %s\n![%s](%s)\n' "$f" "$f" "$f" >> README.md; done
          git add -A && git commit -qm "Capturas del simulador iOS"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas-simulador
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BravoVa-simulador-ios
          path: sim-out
