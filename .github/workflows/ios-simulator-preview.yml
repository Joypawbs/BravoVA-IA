name: Vista en simulador iOS

# Compila la app de ios/, la abre en un iPhone simulado y guarda capturas y un video.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Imagen de macOS (macos-14 o macos-15)"
        default: macos-14

jobs:
  simulator:
    runs-on: ${{ inputs.runner || 'macos-14' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.2.app || true; xcodebuild -version
      - name: Build Kotlin framework (simulator)
        working-directory: ios
        run: ./gradlew --no-daemon :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Install XcodeGen and idb
        run: |
          brew install xcodegen
          brew tap facebook/fb && brew install idb-companion
          python3 -m pip install --break-system-packages fb-idb || pipx install fb-idb
      - name: Build simulator app
        working-directory: ios/iosApp
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build | tail -n 50
      - name: Boot iPhone, install and run
        run: |
          set -x
          xcrun simctl list devices available | grep -i iphone | head -20
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k in sorted(d,reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone 16 Pro') and 'Max' not in x['name']] or [x for k in sorted(d,reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')];print(c[0]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          APP=$(find ios/iosApp/build/sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p sim-out
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force sim-out/recorrido.mp4 &
          echo $! > /tmp/rec.pid
          xcrun simctl spawn "$UDID" log stream --level debug --predicate 'process == "BravoVa"' > sim-out/app.log 2>&1 &
          xcrun simctl launch "$UDID" com.aistudio.bravova.rdshop
          python3 .github/scripts/sim_tour.py sim-out "$UDID" || true
          kill -INT $(cat /tmp/rec.pid) || true
          sleep 3
          xcrun simctl spawn "$UDID" launchctl list | grep -i bravova || echo "La app no está en ejecución (posible cierre)"
          ls -la sim-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BravoVa-simulador-ios
          path: sim-out
