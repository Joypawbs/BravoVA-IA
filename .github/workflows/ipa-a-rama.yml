name: Copiar IPA a una rama
# Para qué: los artefactos de Actions viven en un almacenamiento que algunas herramientas no pueden
# descargar; esta copia deja el IPA en la rama 'ipa' para bajarlo por la API de git.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id de la ejecución de 'BravoVa KMP' que tiene el IPA"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BravoVa-ios-unsigned-ipa
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out
      - run: |
          cd out && ls -la
          git init -q -b ipa
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "IPA de la ejecución ${{ inputs.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ipa
