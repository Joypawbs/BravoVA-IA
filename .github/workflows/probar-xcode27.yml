name: Probar Xcode 27
on: workflow_dispatch
defaults:
  run:
    working-directory: ios
jobs:
  ios:
    name: iOS (simulator build + unsigned device IPA)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build Kotlin framework (simulator)
        run: ./gradlew --no-daemon --stacktrace :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/iosApp
        run: bash ../scripts/generar_proyecto.sh
      - name: Build for iOS Simulator
        working-directory: ios/iosApp
        run: |
          set -o pipefail
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build | tail -n 200
      - name: Build unsigned device IPA (for Sideloadly / AltStore)
        working-directory: ios/iosApp
        run: |
          set -o pipefail
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 200
          APP=$(find build/device/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry BravoVa-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BravoVa-ios-unsigned-ipa
          path: ios/iosApp/BravoVa-unsigned.ipa
