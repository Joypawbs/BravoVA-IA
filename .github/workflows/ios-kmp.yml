name: BravoVa KMP (Android + iOS)

# Versión Compose Multiplatform (Android + iOS) que vive en la carpeta bravova/.
# Se ejecuta a mano (Actions → Run workflow) o cuando cambia algo dentro de bravova/.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'bravova/**', '.github/workflows/ios-kmp.yml' ]

defaults:
  run:
    working-directory: bravova

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Clave de Google Maps (opcional): sin ella el seguimiento usa el mapa ilustrado
  MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

jobs:
  android:
    name: Android (APK debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile common code for iOS (klib, no Mac needed)
        run: ./gradlew --no-daemon --stacktrace :composeApp:compileKotlinIosSimulatorArm64
      - name: Brav IA test bench (unit tests)
        run: ./gradlew --no-daemon --stacktrace :composeApp:testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BravoVa-android-debug
          path: bravova/composeApp/build/outputs/apk/debug/*.apk

  ios:
    name: iOS (simulator build + unsigned device IPA)
    # Xcode 27 + SDK de iOS 27 (imagen de GitHub con Xcode 27 sobre macOS 27, Apple Silicon)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        run: |
          # La imagen xcode-27 trae Xcode 27 como predeterminado
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build Kotlin framework (simulator)
        run: ./gradlew --no-daemon --stacktrace :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: bravova/iosApp
        run: bash ../scripts/generar_proyecto.sh
      - name: Build for iOS Simulator
        working-directory: bravova/iosApp
        run: |
          set -o pipefail
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build | tail -n 200
      - name: Build unsigned device IPA (for Sideloadly / AltStore)
        working-directory: bravova/iosApp
        run: |
          set -o pipefail
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 200
          APP=$(find build/device/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry BravoVa-unsigned.ipa Payload
          # Ícono por capas: confirma que el catálogo compilado lo trae con sus apariencias
          echo "== Ícono en Assets.car =="
          xcrun assetutil --info Payload/*.app/Assets.car | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for x in d:
              n=x.get('Name','')
              if 'AppIcon' in n or 'Icon' in x.get('AssetType',''):
                  print(n, x.get('AssetType'), x.get('Appearance'), x.get('PixelWidth'), x.get('RenditionName'))
          " | sort | uniq -c | head -40 || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" Payload/*.app/Info.plist || true
      - uses: actions/upload-artifact@v4
        with:
          name: BravoVa-ios-unsigned-ipa
          path: bravova/iosApp/BravoVa-unsigned.ipa
